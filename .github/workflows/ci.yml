name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}'
  cancel-in-progress: false

jobs:
  should-run-heavy:
    name: Check if heavy jobs should run
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping heavy CI for dependabot PR"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Check frontend formatting (dprint)
        run: npm run format:check

      # ⚠️ TS7 临时禁用：typescript-eslint 全版本 peer 上限 typescript <6.1.0，
      # 在 TS 7 下 typescript-estree 读已变更内部 API 会崩（TypeError ... 'Cjs'）。
      # 待 typescript-eslint 发 TS7 支持版后，删除 `if: false` 恢复本步骤。
      - name: ESLint check
        if: false
        run: npx eslint src --max-warnings=0

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Check i18n hardcoded strings
        run: bash scripts/check-hardcoded-i18n.sh --strict

      - name: Check backend error code i18n alignment
        run: node scripts/check-errorcode-alignment.mjs

      - name: Contract consistency check (command registration / i18n keys / harness deps)
        run: npm run contracts -- --only=a,c,d

  rust-check:
    name: Rust Check (fmt + clippy + build)
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          key: 'ubuntu-2404-rust-check'
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libpipewire-0.3-dev \
            libwayland-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libgbm-dev \
            libjavascriptcoregtk-4.1-dev protobuf-compiler

      - name: Check formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features \
            --manifest-path src-tauri/Cargo.toml \
            -- -D warnings

      - name: Check build
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

      - name: Setup Node.js (for Rust lint scripts)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint backend error codes (forbid raw map_err)
        run: node scripts/check-rust-raw-map-err.mjs

  test-unit:
    name: Unit Tests
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Add swap space
        run: |
          if [ -f /swapfile ]; then
            echo "Swap file already exists, skipping"
          else
            sudo fallocate -l 8G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile || true
          fi
          echo "Swap status: $(free -h | grep Swap)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          key: 'ubuntu-2404-unit-tests'
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libpipewire-0.3-dev libwayland-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libgbm-dev libjavascriptcoregtk-4.1-dev protobuf-compiler

      - name: Run Rust tests
        run: cargo nextest run --workspace --manifest-path src-tauri/Cargo.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:run

      - name: Run frontend integration tests
        run: npm run test:integration

      - name: npm audit
        run: npm audit --audit-level=high || echo "npm audit found issues (non-blocking, run npm audit fix for details)"

  test-e2e:
    name: E2E Tests (macOS)
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run E2E tests (uses system Chrome, skip 165MB download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npx playwright test --project=chromium --grep-invert "(Agent|Cache|Conversation|Gateway)" --timeout=60000

  cargo-audit:
    name: Security Audit
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit
        continue-on-error: true

      - name: Run cargo audit
        working-directory: src-tauri
        continue-on-error: true
        run: |
          if cargo audit --version &>/dev/null; then
            cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
          else
            echo "cargo-audit not available, skipping"
          fi

  cargo-deny:
    name: License Check
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo deny check
        working-directory: src-tauri
        run: cargo deny check licenses bans sources
