name: Pull Request CI

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop
    tags-ignore:
      - 'v*.*.*'
      - 'test-v*.*.*'

# 最小权限原则：仅授予各 Job 实际需要的权限
permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # ── Dependabot 跳过标记 ──
  should-run-heavy:
    name: Check if heavy jobs should run
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping heavy CI for dependabot PR"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # ── Frontend linting and type checking ────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting (dprint)
        run: npm run format:check

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  # ── Rust formatting and clippy ─────────────────────────
  rust-check:
    name: Rust Check
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          key: 'ubuntu-2404-rust-check'
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libpipewire-0.3-dev \
            libwayland-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev protobuf-compiler

      - name: Check formatting
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy (deny warnings)
        run: |
          cargo clippy --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check build
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

  # ── Unit tests ─────────────────────────────────────────
  test-unit:
    name: Unit Tests
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          key: 'ubuntu-2404-unit-tests'
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libpipewire-0.3-dev libwayland-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev protobuf-compiler

      - name: Run Rust tests
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

  # ── E2E tests on macOS ─────────────────────────────────
  test-e2e:
    name: E2E Tests (macOS)
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1'
          key: 'macos-latest-e2e-tests'
          workspaces: src-tauri -> target

      - name: Install Protoc
        run: brew install protobuf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build Tauri app
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Run E2E tests
        run: npm run test:e2e