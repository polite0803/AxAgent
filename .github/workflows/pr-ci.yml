name: Pull Request CI

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop
    tags-ignore:
      - 'v*.*.*'
      - 'test-v*.*.*'

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  CARGO_BUILD_JOBS: 2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}'
  cancel-in-progress: false

jobs:
  should-run-heavy:
    name: Check if heavy jobs should run
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping heavy CI for dependabot PR"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting (dprint)
        run: npm run format:check

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  rust-check:
    name: Rust Check
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          key: 'ubuntu-2404-rust-check'
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libpipewire-0.3-dev \
            libwayland-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev protobuf-compiler

      - name: Check formatting
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy (deny warnings)
        run: |
          cargo clippy --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check build
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

  test-unit:
    name: Unit Tests
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap added: $(free -h | grep Swap)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          key: 'ubuntu-2404-unit-tests'
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libpipewire-0.3-dev libwayland-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev protobuf-compiler

      - name: Run Rust tests
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml -- --test-threads=2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

  test-e2e:
    name: E2E Tests (macOS)
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e

  cargo-audit:
    name: Security Audit
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: src-tauri
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0437 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0104

  test-coverage:
    name: Test Coverage
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap added: $(free -h | grep Swap)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2'
          key: 'ubuntu-2404-coverage'
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libpipewire-0.3-dev \
            libwayland-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev protobuf-compiler

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --manifest-path src-tauri/Cargo.toml -- --test-threads=2

      - name: Check coverage threshold (≥30%)
        run: |
          TOTAL_LF=$(grep -oP '^LF:\K\d+' lcov.info | awk '{s+=$1}END{print s}')
          TOTAL_LH=$(grep -oP '^LH:\K\d+' lcov.info | awk '{s+=$1}END{print s}')
          if [ "$TOTAL_LF" -eq 0 ]; then
            echo "::warning::No lines found in coverage report"
            exit 0
          fi
          COVERAGE=$(echo "scale=2; $TOTAL_LH * 100 / $TOTAL_LF" | bc)
          echo "Line coverage: ${COVERAGE}% (${TOTAL_LH}/${TOTAL_LF})"
          THRESHOLD=30
          PASS=$(echo "$COVERAGE >= $THRESHOLD" | bc)
          if [ "$PASS" -eq 0 ]; then
            echo "::warning::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 0
          fi
          echo "::notice::Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  cargo-deny:
    name: License Check
    needs: [should-run-heavy]
    if: needs.should-run-heavy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo deny check
        working-directory: src-tauri
        run: cargo deny check licenses bans sources
