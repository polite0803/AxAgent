name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v1.5.9)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NDK_VERSION: 'r26d'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # ── Resolve tag name for both tag push and manual dispatch ──
  resolve-tag:
    name: Resolve Tag Name
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.out.outputs.value }}
    steps:
      - id: out
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved tag: $TAG"

  # ── Validate tag matches package.json version ──────────
  check-version:
    name: Check Version
    needs: [resolve-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Validate tag vs package.json
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          # 从 tag 中提取纯净版号: v2.5.0-beta.1 → 2.5.0
          CLEAN_TAG=$(echo "$TAG" | sed 's/^v//' | sed 's/-.*//')
          PKG_VERSION=$(jq -r .version package.json)
          if [[ "$CLEAN_TAG" != "$PKG_VERSION" ]]; then
            echo "❌ Tag $TAG (clean: $CLEAN_TAG) does not match package.json $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version $TAG is consistent with package.json $PKG_VERSION"

  # ── Generate release notes via git-cliff ─────────────
  draft-release-notes:
    name: Generate Release Notes
    needs: [resolve-tag, check-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          CLIFF_REPO: ${{ github.repository }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: 'AxAgent ${{ needs.resolve-tag.outputs.tag }}'
          body: ${{ steps.cliff.outputs.content }}
          draft: true
          prerelease: ${{ contains(needs.resolve-tag.outputs.tag, '-rc') || contains(needs.resolve-tag.outputs.tag, '-beta') || contains(needs.resolve-tag.outputs.tag, '-alpha') }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Build for macOS / Windows / Linux x86_64 ───────────
  release:
    name: Build (${{ matrix.target }})
    needs: [resolve-tag, check-version, draft-release-notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          # Linux x86_64 (native build on x64 runner; 不需要 cross 工具链)
          # 注：必须用 ubuntu-24.04 (noble)，其 libpipewire-0.3-dev = 1.0.5，
          # 否则 libspa-0.9.2 safe wrapper 与 22.04 的 pipewire 0.3.48 C 结构体不匹配
          # (spa_video_info_raw 缺 flags 字段、modifier 为 i64 而非 u64)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1'
          key: '${{ matrix.os }}-${{ matrix.target }}'
          workspaces: src-tauri -> target
          cache-targets: ${{ matrix.os != 'windows-latest' }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libgbm-dev

      - name: Install Protoc (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get install -y protobuf-compiler

      - name: Install x86_64 OpenSSL (macOS Intel cross-compile)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV

      - name: Install Protoc (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf

      - name: Install create-dmg (macOS DMG bundling)
        if: matrix.os == 'macos-latest'
        run: brew install create-dmg

      - name: Install Protoc (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $ver = '27.3'
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$ver/protoc-$ver-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath "$env:RUNNER_TOOL_CACHE\protoc"
          echo "$env:RUNNER_TOOL_CACHE\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0.5
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
        with:
          # NOTE: Do NOT set tagName/releaseDraft here — tauri-action manages
          # releases via softprops/action-gh-release internally, and running
          # 6+ parallel builds all creating/updating the same draft release
          # causes duplicate-draft race conditions that lose artifacts.
          # The draft is created once by the `draft-release-notes` job, and
          # artifacts are uploaded by explicit softprops/action-gh-release steps below.
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }}
          includeUpdaterJson: true

      - name: Package Windows artifacts
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/AxAgent.exe"
          $arch = if ("${{ matrix.target }}" -match "aarch64") { "arm64" } else { "x64" }
          $zipName = "AxAgent_${{ needs.resolve-tag.outputs.tag }}_windows-${arch}-portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zipName

          $msiPath = "src-tauri/target/${{ matrix.target }}/release/bundle/msi"
          if (Test-Path $msiPath) {
            cd $msiPath
            $msiFiles = Get-ChildItem -Filter "*.msi"
            foreach ($msi in $msiFiles) {
              $newMsiName = "AxAgent_${{ needs.resolve-tag.outputs.tag }}_windows-${arch}.msi"
              Rename-Item -Path $msi.Name -NewName $newMsiName
              Move-Item -Path $newMsiName -Destination "../../$newMsiName"
            }
          }

      - name: Package Linux x86_64 artifacts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          if [ -d "src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb" ]; then
            cd src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb
            for deb in *.deb; do
              new_name="AxAgent_${{ needs.resolve-tag.outputs.tag }}_linux-x64.deb"
              mv "$deb" "$new_name"
              mv "$new_name" "../../$new_name"
            done
          fi

          if [ -d "src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm" ]; then
            cd src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm
            for rpm in *.rpm; do
              new_name="AxAgent_${{ needs.resolve-tag.outputs.tag }}_linux-x64.rpm"
              mv "$rpm" "$new_name"
              mv "$new_name" "../../$new_name"
            done
          fi

      - name: Upload Windows artifacts to release
        if: contains(matrix.target, 'windows')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            AxAgent_${{ needs.resolve-tag.outputs.tag }}_windows-*-portable.zip
            src-tauri/target/${{ matrix.target }}/release/AxAgent_${{ needs.resolve-tag.outputs.tag }}_windows-*.msi

      - name: Package macOS artifacts
        if: contains(matrix.target, 'apple-darwin')
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          for dmg in *.dmg; do
            if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
              new_name="AxAgent_${{ needs.resolve-tag.outputs.tag }}_macos-arm64.dmg"
            else
              new_name="AxAgent_${{ needs.resolve-tag.outputs.tag }}_macos-x64.dmg"
            fi
            mv "$dmg" "$new_name"
            mv "$new_name" "../../$new_name"
          done

      - name: Upload Linux x86_64 artifacts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/AxAgent_${{ needs.resolve-tag.outputs.tag }}_linux-x64.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/AxAgent_${{ needs.resolve-tag.outputs.tag }}_linux-x64.rpm

      - name: Upload macOS artifacts
        if: contains(matrix.target, 'apple-darwin')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/AxAgent_${{ needs.resolve-tag.outputs.tag }}_macos-*.dmg

  # ── Build for Linux ARM64 (native on ARM64 runner) ───
  # 注：用 GitHub ARM64 native runner (ubuntu-24.04-arm) 原生编译，
  # host = target = aarch64，无 cross-compile，彻底绕过 rust-lld bug。
  # rustc 1.67+ 在 x86_64 cross-compile aarch64 时，rust-lld 错误地按
  # target (aarch64) 架构链接 host (x86_64) proc-macro，导致：
  #   rust-lld: error: .../x86_64-linux-gnu/crti.o is incompatible with elf64-littleaarch64
  # 前 9 次尝试用 RUSTFLAGS/env var/ld.lld wrapper 修都失败（rustc 强制注入
  # -fuse-ld=lld -B<sysroot>/gcc-ld/）。native ARM64 runner 是唯一可靠方案。
  # GitHub 2025-01-16 推出 ARM64 runner，对 public repo 免费。
  release-linux-arm:
    name: Build (aarch64-unknown-linux-gnu)
    needs: [resolve-tag, check-version, draft-release-notes]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: aarch64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1'
          key: 'ubuntu-24.04-arm-aarch64-unknown-linux-gnu'
          workspaces: src-tauri -> target

      - name: Install ARM64 native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install

      - name: Build for Linux ARM64
        run: |
          npm run tauri build -- --target aarch64-unknown-linux-gnu --bundles deb,rpm
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package Linux ARM64 artifacts
        run: |
          if [ -d "src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb" ]; then
            cd src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb
            for deb in *.deb; do
              new_name="AxAgent_${{ needs.resolve-tag.outputs.tag }}_linux-arm64.deb"
              mv "$deb" "$new_name"
              mv "$new_name" "../../$new_name"
            done
          fi

          if [ -d "src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm" ]; then
            cd src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm
            for rpm in *.rpm; do
              new_name="AxAgent_${{ needs.resolve-tag.outputs.tag }}_linux-arm64.rpm"
              mv "$rpm" "$new_name"
              mv "$new_name" "../../$new_name"
            done
          fi

      - name: Upload Linux ARM64 artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: 'AxAgent ${{ needs.resolve-tag.outputs.tag }}'
          draft: true
          prerelease: ${{ contains(needs.resolve-tag.outputs.tag, '-rc') || contains(needs.resolve-tag.outputs.tag, '-beta') || contains(needs.resolve-tag.outputs.tag, '-alpha') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/AxAgent_${{ needs.resolve-tag.outputs.tag }}_linux-arm64.deb
            src-tauri/target/aarch64-unknown-linux-gnu/release/AxAgent_${{ needs.resolve-tag.outputs.tag }}_linux-arm64.rpm

  # ── Build for Android ──────────────────────────────────
  build-android:
    name: Build Android (${{ matrix.abi }})
    needs: [resolve-tag, draft-release-notes]
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          submodules: recursive

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.abi == 'arm64-v8a' && 'aarch64-linux-android' || matrix.abi == 'armeabi-v7a' && 'armv7-linux-androideabi' || 'x86_64-linux-android' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v2-android'
          key: 'ubuntu-24.04-ndk${{ env.NDK_VERSION }}-${{ matrix.abi }}'
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Setup JDK 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target-sdk: 34
          build-tools: '34.0.0'
          cmake: '3.22.1'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 0.16.1

      - name: Setup Android NDK toolchain PATH
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN" >> $GITHUB_PATH
          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "=== NDK Setup ==="
          echo "NDK_PATH: $NDK_PATH"
          ls -la "$NDK_PATH/" 2>/dev/null || echo "ERROR: NDK path not found!"
          ls -la "$TOOLCHAIN/" 2>/dev/null || echo "ERROR: Toolchain not found!"
          echo "=================="

      - name: Initialize Android project
        run: |
          cd src-tauri
          echo "=== Checking Android SDK ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "NDK_HOME: $NDK_HOME"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME not set"
          ls -la "$NDK_HOME" 2>/dev/null || echo "NDK_HOME not set"
          echo "==============================="
          npx tauri android init
          echo "=== Generated Android project ==="
          ls -la gen/android/
          echo "==============================="
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

      - name: Ensure Gradle Wrapper
        run: |
          cd src-tauri/gen/android
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing, generating..."
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi
          echo "=== Gradle Wrapper Status ==="
          ls -la gradlew
          ls -la gradle/wrapper/gradle-wrapper.jar
          cat gradle/wrapper/gradle-wrapper.properties
          echo "==============================="
          # Verify critical files exist
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar not found"
            exit 1
          fi

      - name: Setup keystore and signing config
        run: |
          mkdir -p src-tauri/gen/android/app
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > src-tauri/gen/android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
            > src-tauri/gen/android/keystore.properties
          python3 scripts/patch-android-signing.py src-tauri/gen/android/app/build.gradle.kts

          # 添加 ProGuard 规则，防止 R8 混淆/剥离 JNI 桥接类导致闪退
          cp src-tauri/proguard-rules.pro src-tauri/gen/android/app/proguard-rules.pro

      - name: Build frontend (Vite)
        run: npm run build:skip-typecheck

      - name: Limit Gradle memory (prevent runner OOM)
        run: |
          GP=src-tauri/gen/android/gradle.properties
          if [ ! -f "$GP" ]; then
            echo "gradle.properties not found, skip memory tuning"
            exit 0
          fi
          # tauri android init 生成的 gradle.properties 末行（如 android.nonFinalResIds=false）
          # 没有结尾换行符。若不先补上，后续 append 的配置会与末行合并到同一行，
          # 导致 Gradle 解析失败：Cannot parse project property ... as boolean.
          if [ -s "$GP" ] && [ -n "$(tail -c 1 "$GP")" ]; then
            echo "" >> "$GP"
          fi
          # armv7 (32位) 和 arm64 (64位, 需同时产出 APK+AAB) 内存峰值都很高
          # 在 7GB runner 上叠加 cargo-ndk 全量编译极易 OOM → runner 失联
          # 强制覆盖并收紧并行，降低峰值内存
          if [ "${{ matrix.abi }}" = "armeabi-v7a" ] || [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            sed -i '/^org.gradle.jvmargs=/d; /^kotlin.daemon.jvm.options=/d; /^org.gradle.parallel=/d; /^org.gradle.workers.max=/d' "$GP"
            printf '%s\n' \
              'org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC' \
              'kotlin.daemon.jvm.options=-Xmx1024m' \
              'org.gradle.parallel=false' \
              'org.gradle.workers.max=2' >> "$GP"
          else
            grep -q '^org.gradle.jvmargs=' "$GP" \
              || echo 'org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC' >> "$GP"
          fi
          echo "--- gradle.properties ---"
          cat "$GP"

      # 注：APK 与 AAB 在同一次 `tauri android build` 中产出（--apk --aab），
      # 避免为 AAB 单独再启动一次完整的 gradle 构建。此前分两步构建导致
      # arm64-v8a job 二次 gradle 内存峰值叠加，触发 "runner lost communication"
      # (OOM)。仅 arm64-v8a 需要 AAB（Play Store）。
      - name: Build Android APK + AAB
        timeout-minutes: 180
        run: |
          cd src-tauri
          TARGET=${{ matrix.abi == 'arm64-v8a' && 'aarch64' || matrix.abi == 'armeabi-v7a' && 'armv7' || 'x86_64' }}
          # armv7 (32位) 和 arm64 (需同时产出 APK+AAB) 全量编译内存峰值最高
          # 限制 Rust 并行编译降低 OOM 风险
          if [ "${{ matrix.abi }}" = "armeabi-v7a" ] || [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            export CARGO_BUILD_JOBS=2
          fi
          echo "=== System Resources Before Build ==="
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /
          echo "Gradle version:"
          gradle --version 2>/dev/null || echo "gradle CLI not available"
          echo "Java version:"
          java -version 2>&1
          echo "NDK path: $NDK_HOME"
          ls "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" 2>/dev/null | head -5 || echo "WARNING: NDK toolchain not found at $NDK_HOME"
          echo "======================================="
          echo "=== Running tauri android build ==="
          if [[ "${{ matrix.abi }}" == "arm64-v8a" ]]; then
            npx tauri android build --target "$TARGET" --apk --aab
          else
            npx tauri android build --target "$TARGET" --apk
          fi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload APK and AAB to release
        run: |
          # Find release APK from gen/android outputs
          APK=$(find src-tauri/gen/android/app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            # Fallback: search all apk directories for release APKs
            APK=$(find src-tauri/gen/android/app/build/outputs/apk -path "*/release/*" -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          
          if [ -n "$APK" ]; then
            ABI="${{ matrix.abi }}"
            NEW_NAME="AxAgent_${{ needs.resolve-tag.outputs.tag }}_android-${ABI}.apk"
            cp "$APK" "$GITHUB_WORKSPACE/$NEW_NAME"
            echo "Uploading APK: $NEW_NAME from $APK"
            cd "$GITHUB_WORKSPACE"
            gh release upload "${{ needs.resolve-tag.outputs.tag }}" "$NEW_NAME" --clobber
          else
            echo "APK not found in gen/android/outputs/apk"
            ls -la src-tauri/gen/android/app/build/outputs/apk/ 2>/dev/null || true
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          
          # Find and upload AAB (only for arm64-v8a)
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" -type f 2>/dev/null | head -1)
            if [ -n "$AAB" ]; then
              AAB_NAME="AxAgent_${{ needs.resolve-tag.outputs.tag }}_android-play-store.aab"
              cp "$AAB" "$GITHUB_WORKSPACE/$AAB_NAME"
              echo "Uploading AAB: $AAB_NAME"
              cd "$GITHUB_WORKSPACE"
              gh release upload "${{ needs.resolve-tag.outputs.tag }}" "$AAB_NAME" --clobber
            else
              echo "AAB not found, uploading APK only"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build for iOS (暂时禁用：需要 Mac 环境和 Apple 签名证书) ──
  # TODO: 获取 Apple Developer ID 证书 + 在 Mac 上初始化 tauri ios 项目后恢复
  # build-ios:
  #   name: Build iOS
  #   needs: [resolve-tag, draft-release-notes]
  #   runs-on: macos-latest
  #   steps:
  #     ... (详见历史版本)

  # ── Publish draft release as latest ────────────────────
  publish-release:
    name: Publish Release
    needs: [resolve-tag, release, release-linux-arm, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.resolve-tag.outputs.tag, '-rc') || contains(needs.resolve-tag.outputs.tag, '-beta') || contains(needs.resolve-tag.outputs.tag, '-alpha') }}
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy website after release ────────────────────────
  deploy-website:
    name: Deploy Website
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-website.yml',
              ref: 'master',
            });
