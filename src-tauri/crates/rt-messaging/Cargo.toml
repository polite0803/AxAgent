[package]
name = "axagent-rt-messaging"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
axagent-crypto = { path = "../crypto" }
axagent-harness = { path = "../harness" }
axagent-kit = { path = "../kit" }
chrono = { workspace = true }
flate2 = "1"
futures = "0.3"
hex = { workspace = true }
regex = "1"
reqwest = { workspace = true, features = ["multipart", "cookies"] }
roxmltree = "0.21"
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.11"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true }
zstd = { version = "0.13", features = ["experimental"] }

