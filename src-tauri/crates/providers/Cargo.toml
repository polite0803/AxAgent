[package]
name = "axagent-providers"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axagent-harness = { path = "../harness" }
axagent-kit = { path = "../kit" }
futures = "0.3"
reqwest = { workspace = true, features = ["stream", "socks", "rustls", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
computer-use = ["axagent-kit/computer-use"]
