[package]
name = "axagent-runtime"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axagent-agent = { path = "../agent" }
axagent-cache = { path = "../cache" }
axagent-crypto = { path = "../crypto" }
axagent-dao = { path = "../dao" }
axagent-disk-cache = { path = "../disk-cache" }
axagent-document-parser = { path = "../document-parser" }
axagent-entities = { path = "../entities" }
axagent-gateway = { path = "../gateway" }
axagent-harness = { path = "../harness" }
axagent-kit = { path = "../kit" }
axagent-mcp = { path = "../mcp" }
axagent-migration = { path = "../migration" }
axagent-orchestrator = { path = "../orchestrator" }
axagent-plugins = { path = "../plugins" }
axagent-prompt-guard = { path = "../prompt-guard" }
axagent-providers = { path = "../providers" }
axagent-rt-dashboard = { path = "../rt-dashboard" }
axagent-rt-messaging = { path = "../rt-messaging" }
axagent-rt-theme = { path = "../rt-theme" }
axagent-rt-webhook = { path = "../rt-webhook" }
axagent-rt-workflow = { path = "../rt-workflow" }
axagent-runtime-core = { path = "../runtime-core" }
axagent-search = { path = "../search" }
axagent-storage = { path = "../storage" }
axagent-telemetry = { path = "../telemetry" }
axagent-tools = { path = "../tools" }
axagent-trajectory = { path = "../trajectory" }
axum = "0.8"
chrono = { workspace = true }
dirs = "6"
futures = "0.3"
glob = "0.3"
hex = { workspace = true }
parking_lot = "0.12"
regex = "1"
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
sysinfo = "0.39"
thiserror = { workspace = true }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
urlencoding = "2"
uuid = { version = "1.6.1", features = ["v4"] }
walkdir = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.8"

[[bin]]
name = "mcp-test-server"
path = "src/bin/mcp_test_server.rs"
test = false
doctest = false

[dev-dependencies]
axagent-search = { path = "../search" }
tempfile = "3"

[lints]
workspace = true
