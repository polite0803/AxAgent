[package]
name = "axagent-runtime"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
sha2 = "0.10"
glob = "0.3"
axagent-plugins = { path = "../plugins" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.6.1", features = ["v4"] }
walkdir = "2"
reqwest = { workspace = true }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
async-trait = "0.1"
thiserror = { workspace = true }
anyhow = "1"
futures = "0.3"
chrono = { workspace = true }
dirs = "5"
urlencoding = "2"
tokio-util = { version = "0.7", features = ["rt"] }
sea-orm = { workspace = true }
axagent-agent = { path = "../agent" }
axagent-core = { path = "../core" }
axagent-harness = { path = "../harness" }
axagent-runtime-core = { path = "../runtime-core" }
axagent-prompt-guard = { path = "../prompt-guard" }
axagent-rt-workflow = { path = "../rt-workflow" }
axagent-rt-messaging = { path = "../rt-messaging" }
axagent-rt-dashboard = { path = "../rt-dashboard" }
axagent-rt-theme = { path = "../rt-theme" }
axagent-trajectory = { path = "../trajectory" }
axagent-providers = { path = "../providers" }
sysinfo = "0.38"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.8"

[[bin]]
name = "mcp-test-server"
path = "src/bin/mcp_test_server.rs"
test = false
doctest = false

[dev-dependencies]
tempfile = "3"

[lints]
# workspace = true
