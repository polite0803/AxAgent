[package]
name = "axagent-agent"
version.workspace = true
edition.workspace = true
publish = false

[features]
# 启用测试专用 API（如 SessionManager::new_for_test）。
# 仅在 dev-dependencies 或测试构建中启用，避免生产代码依赖实现层 crate。
testing = []

[dependencies]
async-trait = "0.1"
axagent-harness = { path = "../harness" }
axagent-runtime-core = { path = "../runtime-core" }
parking_lot = "0.12"

backon = "1.6"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
docx-rs = "0.4"
fastrand = "2.0"
futures = "0.3"
hex = { workspace = true }
md5 = "0.8"
pdf-extract = "0.12"
regex = "1"
regex-lite = "0.1"
reqwest = { workspace = true }
scraper = "0.27"
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.11"
tauri = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2.4"
urlencoding = "2.1"
uuid = { version = "1.6.1", features = ["v4"] }

[dev-dependencies]
# 测试已全部迁移至 axagent_harness::test_support::* mock，不再依赖实现层 crate
# （符合 AGENTS.md 铁律 5：consumer crate 测试禁止引入实现层 crate）
# - axagent-dao 已移除（session_manager.rs 改用 empty_agent_session_repo()）
# - axagent-kit 已移除（plan_compiler 已上移至 harness，hierarchical_planner.rs 直接走 harness）
# - axagent-migration 已移除（不再需要 setup_test_db 初始化内存数据库）
# - axagent-tools 早已移除（pre_validator.rs 改用 NoopToolRegistry）
insta = { workspace = true }
proptest = "1"
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[[test]]
name = "agent_integration_tests"
path = "tests/agent_integration_tests.rs"

[[test]]
name = "recovery_tests"
path = "tests/recovery_tests.rs"

[[test]]
name = "planner_tests"
path = "tests/planner_tests.rs"

[[test]]
name = "error_recovery_tests"
path = "tests/error_recovery_tests.rs"

[[test]]
name = "react_engine_tests"
path = "tests/react_engine_tests.rs"

[[test]]
name = "proptest_tests"
path = "tests/proptest_tests.rs"
