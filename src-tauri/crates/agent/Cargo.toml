[package]
name = "axagent-agent"
version.workspace = true
edition.workspace = true
publish = false

[features]
# 启用测试专用 API（如 SessionManager::new_for_test）。
# 仅在 dev-dependencies 或测试构建中启用，避免生产代码依赖实现层 crate。
testing = []

[dependencies]
async-trait = "0.1"
axagent-harness = { path = "../harness" }

backon = "1.6"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
docx-rs = "0.4"
fastrand = "2.0"
futures = "0.3"
md5 = "0.7"
pdf-extract = "0.8"
regex = "1"
regex-lite = "0.1"
reqwest = { workspace = true }
scraper = "0.22"
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.10"
tauri = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2.4"
urlencoding = "2.1"
uuid = { version = "1.6.1", features = ["v4"] }

[dev-dependencies]
axagent-dao = { path = "../dao" }
# 技术债：以下三个实现层 crate 在 src/ 的 #[cfg(test)] 模块中使用，违反 AGENTS.md 铁律 5
# （consumer crate 测试禁止引入实现层 crate，应通过 axagent_harness::test_support::* mock）
# 后续需重构测试代码改用 harness mock，再移除这些依赖
axagent-kit = { path = "../kit" }
axagent-migration = { path = "../migration" }
axagent-tools = { path = "../tools" }
insta = { workspace = true }
proptest = "1"
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[[test]]
name = "agent_integration_tests"
path = "tests/agent_integration_tests.rs"

[[test]]
name = "recovery_tests"
path = "tests/recovery_tests.rs"

[[test]]
name = "planner_tests"
path = "tests/planner_tests.rs"

[[test]]
name = "error_recovery_tests"
path = "tests/error_recovery_tests.rs"

[[test]]
name = "coordinator_tests"
path = "tests/coordinator_tests.rs"

[[test]]
name = "react_engine_tests"
path = "tests/react_engine_tests.rs"

[[test]]
name = "proptest_tests"
path = "tests/proptest_tests.rs"
