[package]
name = "axagent-credential"
version.workspace = true
edition.workspace = true
publish = false
description = "Credential management — AES-256-GCM encrypted storage and runtime cache"

[dependencies]
aes-gcm = "0.11"
async-trait = "0.1"
axagent-harness = { path = "../harness" }
base64 = "0.22"
chrono = { workspace = true }
hex = { workspace = true }
# 跨平台 OS 密钥库（macOS Keychain / Windows Credential Manager / Linux secret-service）
# 用于持久化主密钥，避免重启后随机生成导致旧凭证无法解密
keyring = "4"
rand = "0.10"
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
