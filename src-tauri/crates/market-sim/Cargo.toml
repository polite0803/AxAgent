[package]
name = "axagent-market-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ABIDES-inspired market simulation: limit order book, DES kernel, multi-agent trading"

[dependencies]
axagent-harness = { path = "../harness" }
chrono = { workspace = true }
futures = "0.3"
rand = { version = "0.8", features = ["std_rng"] }
# rhai 用于 RhaiAgent（用户自定义脚本 Agent）；sync 特性使 Engine 满足 Send + Sync
rhai = { version = "1", features = ["sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"

[dev-dependencies]
# 测试中实现 Strategy trait 需要 async_trait 宏（market-sim 自身是 consumer，
# 按铁律 5 不依赖 quant，本地 MockMaCrossStrategy 替代真实策略）
async-trait = "0.1"
