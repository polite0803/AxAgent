[package]
name = "axagent-telemetry"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1.4"
prometheus = "0.13"
tokio = { version = "1", features = ["sync"] }
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "metrics", "http-proto"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "metrics", "rt-tokio"] }
axagent-core = { path = "../core" }
tracing = "0.1"

[lints]
# workspace = true
