[package]
name = "axagent-telemetry"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
axagent-harness = { path = "../harness" }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
opentelemetry = { version = "0.30", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.30", features = ["trace", "metrics", "http-proto"] }
opentelemetry_sdk = { version = "0.30", features = ["trace", "metrics", "rt-tokio"] }
prometheus = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
# workspace = true
