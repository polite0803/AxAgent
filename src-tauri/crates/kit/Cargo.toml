[package]
name = "axagent-kit"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
axagent-dao = { path = "../dao" }
axagent-harness = { path = "../harness" }
base64 = "0.22"
chrono = { workspace = true }
dirs = "5"
enigo = { workspace = true }
image = { workspace = true }
keyring = "2"
libc = "0.2"
regex = "1"
reqwest = { workspace = true }
scraper = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
shellexpand = "3"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
xcap = { workspace = true, features = ["wgc"] }
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
