[package]
name = "axagent-kit"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
axagent-dao = { path = "../dao" }
axagent-entities = { path = "../entities" }
axagent-harness = { path = "../harness" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }
scraper = "0.22"
thiserror = { workspace = true }
anyhow = { workspace = true }
enigo = { workspace = true }
serde_yaml = { workspace = true }
regex = "1"
keyring = "2"
dirs = "5"
shellexpand = "3"
reqwest = { workspace = true }
image = { workspace = true }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
xcap = { workspace = true, features = ["wgc"] }
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
