[package]
name = "axagent-company-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# P3 公司运行时内核（AxInvest 本地，implementor）
# 依赖基座既有能力（rt-workflow DAG / trajectory RL / rt-messaging 渠道 / harness DTO），
# 在其上实现 OpenOPC 三机制：Self-Built（组织/招聘）/ Self-Run（WorkItem 状态机）/ Self-Grown（经验闭环）。
# 依赖方向：implementor 可依赖 harness + entities + dao + opc-entities + trajectory；不依赖 consumer。

[dependencies]
async-trait = "0.1"
axagent-analysis-engine = { path = "../analysis-engine" }
axagent-entities = { path = "../entities" }
axagent-harness = { path = "../harness" }
chrono = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axagent-dao = { path = "../dao" }
tokio = { workspace = true, features = ["full"] }
