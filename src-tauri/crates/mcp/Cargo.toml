[package]
name = "axagent-mcp"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "axagent-mcp-serve"
path = "src/bin/mcp_serve.rs"

[dependencies]
async-trait = "0.1"
axagent-harness = { path = "../harness" }
base64 = "0.22"
dirs = "6"
futures = "0.3"
parking_lot = "0.12"
rand = "0.10"
reqwest = { workspace = true }
rmcp = { version = "2.2", features = ["server", "transport-io", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
