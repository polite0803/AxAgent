[package]
name = "axagent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Re-export shell crate.
# All `axagent-*` deps are kept as direct deps so that `pub use axagent_x::y`
# in `lib.rs` can forward their items. External (non-`axagent-*`) deps are
# only kept if `src/*.rs` actually uses them; transitive deps consumed by
# the re-exported sub-crates do not need to be declared here.

[dependencies]
# Re-export targets (referenced by `pub use` in lib.rs)
axagent-cache = { path = "../cache" }
axagent-crypto = { path = "../crypto" }
axagent-dao = { path = "../dao" }
axagent-disk-cache = { path = "../disk-cache" }
axagent-document-parser = { path = "../document-parser" }
axagent-entities = { path = "../entities" }
axagent-harness = { path = "../harness" }
axagent-kit = { path = "../kit" }
axagent-mcp = { path = "../mcp" }
axagent-search = { path = "../search" }
axagent-storage = { path = "../storage" }

# Direct usage in src/
anyhow = { workspace = true } # platform_config.rs (anyhow::bail!)
serde = { workspace = true } # workflow_types.rs (derive Serialize/Deserialize)
serde_json = { workspace = true } # workflow_types.rs (from_str)
tokio = { workspace = true } # tests/*.rs use #[tokio::test]
toml_edit = "0.22" # tests/cli_config_integration.rs

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[package.metadata.cargo-machete]
# All declared deps are re-export targets referenced by `pub use` in lib.rs,
# or direct deps used in src/*.rs (anyhow/serde/serde_json).
ignored = []
