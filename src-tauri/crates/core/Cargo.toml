[package]
name = "axagent-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sea-orm = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
aes-gcm = "0.10"
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
reqwest = { workspace = true, features = ["stream", "multipart", "cookies"] }
futures = "0.3"
rmcp = { version = "1.2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
walkdir = "2"
regex = "1"
glob = "0.3"
dirs = "5"
rand = "0.8"
hex = "0.4"
toml_edit = "0.22"
sqlite-vec = { workspace = true }
libsqlite3-sys = { workspace = true }
pdf-extract = "0.7"
zip = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.38"
enigo = { workspace = true }
axagent-migration = { path = "../migration" }
quick_cache = "0.4"
image = { workspace = true }
which = "7"
libc = "0.2"
docx-rs = "0.4"
roxmltree = "0.20"
md5 = "0.7"
scraper = "0.22"
candle-core = "0.8"
candle-transformers = "0.8"
candle-nn = "0.8"
tokenizers = "0.21"
hf-hub = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
notify = { version = "8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

[target.'cfg(windows)'.dependencies]
xcap = { workspace = true, features = ["wgc"] }
notify = { version = "8", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos", windows)))'.dependencies]
notify = { version = "8", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[dev-dependencies]
tempfile = "3"
