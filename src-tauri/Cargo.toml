[workspace]
members = [
  ".",
  "crates/agent",
  "crates/agent-command-types",
  "crates/agent-macro",
  "crates/cache",
  "crates/crdt",
  "crates/credential",
  "crates/crypto",
  "crates/dao",
  "crates/device",
  "crates/disk-cache",
  "crates/document-parser",
  "crates/entities",
  "crates/gateway",
  "crates/harness",
  "crates/kit",
  "crates/mcp",
  "crates/migration",
  "crates/npm",
  "crates/orchestrator",
  "crates/plugins",
  "crates/prompt-guard",
  "crates/providers",
  "crates/rt-dashboard",
  "crates/rt-messaging",
  "crates/rt-theme",
  "crates/rt-webhook",
  "crates/rt-workflow",
  "crates/runtime",
  "crates/runtime-core",
  "crates/search",
  "crates/storage",
  "crates/telemetry",
  "crates/tools",
  "crates/trajectory",
  "schema-gen",
]
resolver = "2"

[workspace.package]
version = "2.9.1"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
enigo = "0.6"
hex = "0.4"
image = { version = "0.25", features = ["png"] }
insta = { version = "1.48", features = ["yaml", "json", "redactions"] }
lazy_static = "1"
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json"] }
sea-orm = { version = "2.0.0-rc.40", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
sqlite-vec = "0.1.8-alpha.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
xcap = "0.9.6"

[package]
name = "axagent"
version = "2.9.1"
authors = ["刘小平 <polite0803@outlook.com>"]
default-run = "AxAgent"
edition = "2024"
license = "AGPL-3.0-only"
description = "AxAgent - AI Chat Desktop App"

[features]
default = ["notification", "browser-use", "computer-use", "channel-platforms"]
notification = ["dep:tauri-plugin-notification"]
browser-use = []
computer-use = ["axagent-providers/computer-use"]
channel-platforms = []
server = []

[package.metadata.cargo-machete]
# All declared axagent-* path deps are referenced in src/app_state.rs as
# `Arc<axagent_xxx::Type>` in struct field types — a use site that
# cargo-machete's text-based scan cannot detect.
ignored = [
  "axagent-prompt-guard",
  "axagent-rt-dashboard",
  "axagent-rt-messaging",
  "axagent-rt-theme",
  "axagent-rt-webhook",
]

[lib]
name = "axagent_lib"
# cdylib: Android/iOS 动态库 (.so/.dylib)，Tauri mobile 构建必需
# staticlib: macOS/iOS 静态库 (.a)
# rlib: Rust 内部依赖（其他 crate 引用时用）
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AxAgent"
path = "src/main.rs"

[[bin]]
name = "axagent-server"
path = "src/server_main.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-command-types = { path = "crates/agent-command-types" }
agent-macro = { path = "crates/agent-macro" }
async-trait = "0.1"
axagent-agent = { path = "crates/agent" }
axagent-cache = { path = "crates/cache" }
axagent-credential = { path = "crates/credential" }
axagent-crypto = { path = "crates/crypto" }
axagent-dao = { path = "crates/dao" }
axagent-device = { path = "crates/device" }
axagent-disk-cache = { path = "crates/disk-cache" }
axagent-document-parser = { path = "crates/document-parser" }
axagent-entities = { path = "crates/entities" }
axagent-gateway = { path = "crates/gateway" }
axagent-harness = { path = "crates/harness" }
axagent-kit = { path = "crates/kit" }
axagent-mcp = { path = "crates/mcp" }
axagent-migration = { path = "crates/migration" }
axagent-npm = { path = "crates/npm" }
axagent-orchestrator = { path = "crates/orchestrator" }
axagent-plugins = { path = "crates/plugins" }
axagent-prompt-guard = { path = "crates/prompt-guard" }
axagent-providers = { path = "crates/providers" }
axagent-rt-dashboard = { path = "crates/rt-dashboard" }
axagent-rt-messaging = { path = "crates/rt-messaging" }
axagent-rt-theme = { path = "crates/rt-theme" }
axagent-rt-webhook = { path = "crates/rt-webhook" }
axagent-rt-workflow = { path = "crates/rt-workflow" }
axagent-runtime = { path = "crates/runtime" }
axagent-runtime-core = { path = "crates/runtime-core" }
axagent-search = { path = "crates/search" }
axagent-storage = { path = "crates/storage" }
axagent-telemetry = { path = "crates/telemetry" }
axagent-tools = { path = "crates/tools" }
axagent-trajectory = { path = "crates/trajectory" }
base64 = "0.22"
chrono = { workspace = true }
dashmap = { workspace = true }
dirs = "6"
feed-rs = "2"
flate2 = "1"
futures = "0.3"
hex = { workspace = true }
hostname = "0.4"
inventory = "0.3"
lazy_static = { workspace = true }
notify = "9.0.0-rc.4"
open = "5"
rcgen = "0.14"
reqwest = { workspace = true }
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "ring"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
sysinfo = "0.39"
tar = "0.4"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tempfile = "3"
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "chrono"] }
urlencoding = "2"
uuid = { workspace = true }
walkdir = "2"
zip = "8"

[target.'cfg(not(target_os = "android"))'.dependencies]
font-kit = "0.14"
tauri-plugin-mcp-bridge = "0.12"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", features = ["relax-sign-encoding"] }

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
android_logger = "0.15"
log = { version = "0.4" }
tracing-log = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev]
opt-level = 0
# line-tables-only: 仅生成行号表，保留 panic 回溯的源文件+行号。
# 相比 debug = true（完整符号表），编译时间降 30-50%，链接时间降 50%+。
# 代价：调试器里看不到局部变量值；
#       需要完整调试时执行 `CARGO_PROFILE_DEV_DEBUG=true cargo build` 覆盖。
debug = "line-tables-only"
incremental = true

[dev-dependencies]
axagent-agent = { path = "crates/agent", features = ["testing"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "tool_exec_bench"
harness = false

[[bench]]
name = "llm_call_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false
