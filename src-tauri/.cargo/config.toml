[target.x86_64-pc-windows-msvc]
# mold 2.41.0 已安装但 MSVC 兼容性问题，暂用 lld-link
# 如需启用 mold：将下方 linker 改为 D:\OneManager\AxAgent\tools\mold\mold.exe
linker = "C:\\Program Files\\LLVM\\bin\\lld-link.exe"
rustflags = ["-C", "target-feature=+crt-static"]

[env]
__TAURI_WORKSPACE__ = "true"
RUSTC_WRAPPER = "sccache"
SCCACHE_CACHE_SIZE = "50G"

[build]
# 16 核全利用：原 jobs=8 只用了一半核心
jobs = 16

[unstable]
# 增量编译优化：提前发送分析结果，减少等待时间
timings = false
