[target.x86_64-pc-windows-msvc]
# 使用 rustc 默认的 MSVC link.exe（通过环境变量自动定位），不再覆盖 linker
# 说明：原配置引用 C:\Program Files\LLVM\bin\lld-link.exe 但 LLVM 未安装；mold 存在但 MSVC 兼容性不佳
# 如需恢复 mold：将下方 linker 改为 D:\OneManager\AxAgent\tools\mold\mold.exe
# linker = "C:\\Program Files (x86)\\Microsoft Visual Studio\\18\\BuildTools\\VC\\Tools\\MSVC\\14.51.36231\\bin\\Hostx64\\x64\\link.exe"
rustflags = ["-C", "target-feature=+crt-static"]

[env]
__TAURI_WORKSPACE__ = "true"

[build]
# 16 核全利用：原 jobs=8 只用了一半核心
jobs = 16

[unstable]
# 增量编译优化：提前发送分析结果，减少等待时间
timings = false
