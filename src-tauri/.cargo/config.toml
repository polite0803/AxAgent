[target.x86_64-pc-windows-msvc]
# 使用 rustc 自带的 rust-lld 作为 MSVC 链接器（Rust 1.71+ 原生支持，自动按 msvc flavor 调用）。
# 相比 MSVC link.exe，链接速度提升数倍，直击"3200+ crate 全量链接"这一核心瓶颈（主 bin 每次改动都要全量 relink）。
# 已用临时 crate 以 `-C linker=rust-lld -C target-feature=+crt-static` 验证可正常链接出 exe。
# 如需回退 link.exe，删除下面 linker 一行并恢复 rustflags 即可。
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# manifest 策略：
#   主程序构建 — build.rs 中设置 TAURI_MANIFEST 环境变量，tauri_build::build() 使用自定义 manifest
#   测试构建 — 需手动设置 __TAURI_WORKSPACE__=true，build.rs 跳过 tauri_build::build()，手动嵌入 manifest
#   运行测试: $env:__TAURI_WORKSPACE__ = "true"; cargo test -p axagent --lib

[build]
# 16 核全利用：原 jobs=8 只用了一半核心
jobs = 16

[unstable]
# 增量编译优化：提前发送分析结果，减少等待时间
timings = false
