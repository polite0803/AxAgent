# 平衡型默认策略包 — 覆盖四大风格，适合新手
# 每个风格启用一个周期，权重均衡
name: "平衡型默认策略包"
description: "覆盖趋势/价值/资金/反弹四大风格，每个风格启用一个周期，适合新手入门"
version: "1.0.0"
author: "AxInvest"
minConfidence: 65
maxPicks: 8
strategies:
  - id: "trend_short"
    strategyId: "trend"
    style: "trend"
    period: "short"
    enabled: true
    weight: 1.0
    params:
      trend_ma_short_1: 5
      trend_ma_short_2: 10
      trend_ma_short_3: 20
      trend_short_ma20_tolerance: 0.985
      trend_high_20_period: 20
      trend_high_20_threshold: 0.97
      trend_amount_ratio_min: 0.8
      trend_short_entry_low: 0.99
      trend_short_entry_high: 1.015
      trend_short_stop: 0.95
      trend_short_target: 1.10
      trend_short_base_pos: 5.0
  - id: "value_short"
    strategyId: "value"
    style: "value"
    period: "short"
    enabled: true
    weight: 1.0
    params:
      val_short_pe_max: 50
      val_short_pb_max: 3.0
      val_short_kline_limit: 30
      val_short_min_kline_len: 20
      val_short_ma_period: 20
      val_short_ma_mult: 1.005
  - id: "capital_short"
    strategyId: "capital"
    style: "capital"
    period: "short"
    enabled: true
    weight: 0.9
    params:
      cap_kline_vol_ratio_min: 1.5
      cap_kline_mom_5_min: -0.02
      cap_kline_mom_5_max: 0.10
      cap_short_main_inflow_min: 200.0
      cap_short_turnover_min: 2.0
  - id: "reversion_mid"
    strategyId: "reversion"
    style: "reversion"
    period: "mid"
    enabled: true
    weight: 0.8
    params:
      rev_mid_drop_pct_min: -0.15
      rev_mid_drop_pct_max: -0.25
      rev_mid_rsi_max: 35
      rev_mid_kline_limit: 60
