# 中线平衡策略包 — 中周期多风格
name: "中线平衡策略包"
description: "聚焦中周期，混合趋势/价值/资金/反弹四风格，适合中线投资者"
version: "1.0.0"
author: "AxInvest"
minConfidence: 70
maxPicks: 8
strategies:
  - id: "trend_mid"
    strategyId: "trend"
    style: "trend"
    period: "mid"
    enabled: true
    weight: 1.1
    params:
      trend_ma_mid_s: 20
      trend_ma_mid_l: 60
      trend_ma60_threshold: 0.985
      trend_high_60_period: 60
      trend_high_60_threshold: 0.94
      trend_mid_kline_limit: 150
      trend_mid_min_kline_len: 60
  - id: "value_mid"
    strategyId: "value"
    style: "value"
    period: "mid"
    enabled: true
    weight: 1.0
    params:
      val_mid_pe_max: 40
      val_mid_pb_max: 2.5
      val_mid_roe_min: 10.0
      val_mid_kline_limit: 60
      val_mid_min_kline_len: 50
  - id: "capital_mid"
    strategyId: "capital"
    style: "capital"
    period: "mid"
    enabled: true
    weight: 0.9
    params:
      cap_mid_nb_ratio_min: 0.3
      cap_mid_main_inflow_min: 500.0
  - id: "reversion_mid"
    strategyId: "reversion"
    style: "reversion"
    period: "mid"
    enabled: true
    weight: 0.8
    params:
      rev_mid_drop_pct_min: -0.15
      rev_mid_drop_pct_max: -0.25
      rev_mid_rsi_max: 35
      rev_mid_kline_limit: 60
