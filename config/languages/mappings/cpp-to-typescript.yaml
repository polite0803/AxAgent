      └── ...

  # 迁移优先级
  migration_priority:
    phase1_core:
      description: "核心数据类型和基类"
      components:
        - "UtVec3, UtMatrix → nalgebra"
        - "WsfObject → Entity trait"
        - "WsfPlatform → Agent struct"
      estimated_effort: "2-3 周"
    
    phase2_engine:
      description: "仿真引擎核心逻辑"
      components:
