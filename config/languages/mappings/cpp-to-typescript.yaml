# ── Afsim 特定 Qt Widget 增强映射 ──
afsim_qt_widget_enhanced_mapping:
  description: "Afsim 项目中特定 Qt Widget 的增强映射"
  
  # 复杂 Dock 窗口系统
  dock_widget_system:
    - source: "QDockWidget (Afsim 有 50+ 个)"
      target: "Ant Design Segmented + 可拖拽面板系统"
      implementation: |
        // TypeScript:
        import { Segmented } from 'antd';
        import { DraggablePanel, DroppablePanel } from '@ant-design/pro-components';
        
        const AfsimLayout = () => {
          const [activeKey, setActiveKey] = useState('simulation');
          
          return (
            <div className="flex h-screen">
              <div className="w-64 border-r">
                <Segmented
                  vertical
                  active={activeKey}
                  onChange={setActiveKey}
                  options={[
                    { label: '仿真控制', value: 'simulation' },
                    { label: '平台管理', value: 'platform' },
                    { label: '航迹显示', value: 'track' },
                    { label: '日志输出', value: 'log' },
                  ]}
                />
              </div>
              <div className="flex-1">
                {activeKey === 'simulation' && <SimulationControlPanel />}
                {activeKey === 'platform' && <PlatformManagementPanel />}
                {activeKey === 'track' && <TrackDisplayPanel />}
                {activeKey === 'log' && <LogOutputPanel />}
              </div>
            </div>
          );
        };
  
  # 3D 视图组件
  view_3d_components:
    - source: "QGLWidget / QOpenGLWidget"
      target: "Three.js Canvas 组件"
      implementation: |
        // TypeScript:
        import { Canvas } from '@react-three/fiber';
        import { OrbitControls, Stars } from '@react-three/drei';
        
        const Afsim3DView = ({ platforms }) => {
          return (
            <Canvas camera={{ position: [0, 1000, 3000], fov: 60 }}>
              <ambientLight intensity={0.5} />
              <Stars radius={100} depth={50} count={5000} factor={4} />
              {platforms.map(platform => (
                <PlatformModel 
                  key={platform.id} 
                  platform={platform} 
                />
              ))}
              <OrbitControls enablePan enableZoom enableRotate />
            </Canvas>
          );
        };
    
    - source: "Qt 自定义绘制 (QPaint)"
      target: "Canvas API / SVG / D3.js"
      implementation: |
        // TypeScript (D3.js 用于数据可视化):
        import { select, scaleLinear, line } from 'd3';
        
        const AfsimChart = ({ data }) => {
          const svgRef = useRef<SVGSVGElement>(null);
          
          useEffect(() => {
            const svg = select(svgRef.current);
            // 创建 D3 图表...
          }, [data]);
          
          return <svg ref={svgRef} className="w-full h-full" />;
        };

  # 自定义委托绘制
  item_delegate_mapping:
    - source: "QStyledItemDelegate"
      target: "Ant Design Table Column render"
      example: |
        // C++ (Qt):
        class StatusDelegate : public QStyledItemDelegate {
            void paint(QPainter* painter, const QStyleOptionViewItem& option, 
                      const QModelIndex& index) const override {
                QString status = index.data().toString();
                QColor color = (status == "Active") ? Qt::green : Qt::red;
                painter->setPen(color);
                painter->drawText(option.rect, Qt::AlignCenter, status);
            }
        };
        
        // TypeScript:
        const columns = [
          {
            title: '状态',
            dataIndex: 'status',
            render: (status: string) => (
              <Tag color={status === 'Active' ? 'green' : 'red'}>
                {status}
              </Tag>
            ),
          },
        ];

  # 模型视图框架
  model_view_framework_mapping:
    - source: "QAbstractItemModel"
      target: "Zustand Store + 选择器"
      complexity: "high"
      strategy: |
        // QAbstractItemModel → Zustand Store:
        // 1. 将 rowCount() → items.length
        // 2. 将 data(index) → items[index.row][column]
        // 3. 将 setData() → updateItem(id, key, value)
        // 4. 将 modelReset → 重新获取数据
        
        // TypeScript:
        const useTableStore = create<TableState>((set, get) => ({
          items: [],
          loading: false,
          filters: {},
          
          fetchItems: async () => {
            set({ loading: true });
            const items = await api.getItems(get().filters);
            set({ items, loading: false });
          },
          
          updateItem: (id, key, value) => {
            set(state => ({
              items: state.items.map(item =>
                item.id === id ? { ...item, [key]: value } : item
              )
            }));
          },
          
          // 选择器 (替代 QModelIndex)
          getItemById: (id) => get().items.find(i => i.id === id),
        }));

# ── 3D 可视化迁移指南 (QtOpenGL → Three.js) ──
visualization_3d_migration:
  description: "Qt OpenGL 3D 可视化迁移到 Three.js / WebGL 的完整指南"
  
  # Qt OpenGL 组件映射
  opengl_widget_mapping:
    - source: "QGLWidget / QOpenGLWidget"
      target: "@react-three/fiber Canvas"
      complexity: "high"
      example: |
        // C++ (Qt OpenGL):
        // class MyGLWidget : public QOpenGLWidget {
        //     void initializeGL() { ... }
        //     void paintGL() { ... }
        //     void resizeGL(int w, int h) { ... }
        // };
        
        // TypeScript (React Three Fiber):
        import { Canvas } from '@react-three/fiber';
        import { OrbitControls, PerspectiveCamera } from '@react-three/drei';
        
        function My3DView() {
          return (
            <Canvas camera={{ position: [0, 0, 1000], fov: 45 }}>
              <PerspectiveCamera makeDefault position={[0, 0, 1000]} />
              <OrbitControls enablePan enableZoom enableRotate />
              <ambientLight intensity={0.5} />
              <directionalLight position={[100, 100, 100]} intensity={1} />
              {/* 3D 对象将在这里渲染 */}
            </Canvas>
          );
        }
    
    - source: "QOpenGLFunctions"
      target: "Three.js WebGLRenderer"
      complexity: "medium"
      mapping:
        - glClear → renderer.setClearColor()
        - glViewport → renderer.setSize()
        - glEnable/glDisable → Three.js 对应属性
        - glDrawElements → mesh.geometry
    
    - source: "QOpenGLBuffer"
      target: "Three.js BufferGeometry"
      complexity: "high"
      mapping:
        - 顶点数据 → geometry.attributes.position.array
        - 索引数据 → geometry.index.array
        - 法线数据 → geometry.attributes.normal.array
    
    - source: "QOpenGLShaderProgram"
      target: "Three.js ShaderMaterial / 内置材质"
      complexity: "high"
      mapping:
        - 顶点着色器 → material.vertexShader
        - 片段着色器 → material.fragmentShader
        - uniform 变量 → material.uniforms

  # 3D 场景元素映射
  scene_element_mapping:
    # 几何图元
    primitives:
      - source: "glutSolidCube / glutWireCube"
        target: "boxGeometry"
        example: |
          // C++: glutSolidCube(1.0);
          // TypeScript:
          <mesh>
            <boxGeometry args={[1, 1, 1]} />
            <meshStandardMaterial color="red" />
          </mesh>
      
      - source: "glutSolidSphere / glutWireSphere"
        target: "sphereGeometry"
        example: |
          // TypeScript:
          <mesh>
            <sphereGeometry args={[radius, segments, rings]} />
            <meshStandardMaterial color="blue" />
          </mesh>
      
      - source: "glutSolidCone / glutWireCone"
        target: "coneGeometry"
      
      - source: "glutSolidCylinder"
        target: "cylinderGeometry"
      
      - source: "glutSolidTorus"
        target: "torusGeometry"
      
      - source: "glutSolidDodecahedron"
        target: "dodecahedronGeometry"
      
      - source: "glutSolidOctahedron"
        target: "octahedronGeometry"
      
      - source: "glutSolidTetrahedron"
        target: "tetrahedronGeometry"
      
      - source: "glutSolidIcosahedron"
        target: "icosahedronGeometry"
    
    # 复杂几何
    complex_geometry:
      - source: "自定义 QOpenGLBuffer (顶点数组)"
        target: "BufferGeometry + setAttribute"
        example: |
          // C++: 创建顶点数组并绑定
          // GLfloat vertices[] = { 0, 0, 0,  1, 0, 0,  ... };
          // glVertexAttribPointer(0, 3, GL_FLOAT, GL_FALSE, 0, vertices);
          
          // TypeScript:
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', 
            new THREE.Float32BufferAttribute(vertices, 3));
          geometry.computeVertexNormals();
    
    # 加载外部模型
    model_loading:
      - source: "Assimp / OpenAssetImport (Qt 框架)"
        target: "GLTFLoader / FBXLoader / OBJLoader"
        example: |
          // TypeScript (加载 GLTF):
          import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
          
          const loader = new GLTFLoader();
          loader.load('/models/scene.gltf', (gltf) => {
            scene.add(gltf.scene);
          });
      
      - source: ".obj 文件加载"
        target: "OBJLoader"
        example: |
          import { OBJLoader } from 'three/examples/jsm/loaders/OBJLoader.js';
          
          const loader = new OBJLoader();
          loader.load('/models/model.obj', (object) => {
            scene.add(object);
          });

  # 光照映射
  lighting_mapping:
    - source: "glLight(GL_LIGHT0, GL_POSITION, ...)"
      target: "directionalLight / pointLight"
      example: |
        // C++:
        // GLfloat lightPos[] = { 0, 1, 0 };
        // glLightfv(GL_LIGHT0, GL_POSITION, lightPos);
        // glEnable(GL_LIGHTING);
        
        // TypeScript:
        <directionalLight 
          position={[0, 100, 0]} 
          intensity={1}
          castShadow
        />
    
    - source: "glAmbient"
      target: "ambientLight"
      example: |
        <ambientLight intensity={0.3} />
    
    - source: "glShininess + specular"
      target: "MeshStandardMaterial.metalness/roughness"
      example: |
        <meshStandardMaterial 
          color={color}
          metalness={0.8}
          roughness={0.2}
        />

  # 相机控制映射
  camera_control_mapping:
    - source: "gluPerspective / glOrtho"
      target: "PerspectiveCamera / OrthographicCamera"
      example: |
        // C++: gluPerspective(fov, aspect, near, far);
        // TypeScript:
        <PerspectiveCamera 
          fov={45} 
          aspect={windowWidth / windowHeight}
          near={0.1}
          far={10000}
        />
    
    - source: "gluLookAt"
      target: "camera.position + camera.lookAt"
      example: |
        // C++: gluLookAt(eyeX, eyeY, eyeZ, centerX, centerY, centerZ, upX, upY, upZ);
        // TypeScript:
        camera.position.set(eyeX, eyeY, eyeZ);
        camera.lookAt(centerX, centerY, centerZ);
    
    - source: "QMouseMoveEvent / QWheelEvent (自定义交互)"
      target: "OrbitControls / CustomControls"
      example: |
        // TypeScript (OrbitControls):
        import { OrbitControls } from '@react-three/drei';
        
        <OrbitControls
          enablePan={true}
          enableZoom={true}
          enableRotate={true}
          minDistance={100}
          maxDistance={5000}
        />

  # Afsim 3D 特定场景
  afsim_3d_scenarios:
    - scenario: "战场态势显示"
      description: "显示多个平台位置、运动轨迹、武器发射等"
      implementation: |
        // 战场 3D 场景组件
        function Battlefield3D({ platforms, events }) {
          return (
            <Canvas camera={{ position: [0, 500, 1500], fov: 60 }}>
              <Terrain />
              <Platforms platforms={platforms} />
              <TrackTrails platforms={platforms} />
              <EventMarkers events={events} />
              <Skybox />
              <OrbitControls enablePan enableZoom enableRotate />
            </Canvas>
          );
        }
    
    - scenario: "地球坐标可视化"
      description: "WGS84 经纬度 → 3D 地球模型"
      implementation: |
        // 地球组件
        function Earth3D({ positions }) {
          const earthRef = useRef();
          
          return (
            <Canvas>
              <mesh ref={earthRef}>
                <sphereGeometry args={[6371, 64, 64]} />
                <meshStandardMaterial 
                  color="blue" 
                  wireframe={false}
                  transparent 
                  opacity={0.8}
                />
              </mesh>
              {/* 绘制位置点 */}
              {positions.map(pos => (
                <PositionMarker 
                  key={pos.id}
                  lat={pos.lat}
                  lon={pos.lon}
                />
              ))}
              <OrbitControls enablePan enableZoom enableRotate />
            </Canvas>
          );
        }
    
    - scenario: "飞行器三维模型"
      description: "显示飞行器几何形状、姿态、动画"
      implementation: |
        // 飞行器组件
        function Aircraft3D({ platform, animation }) {
          const groupRef = useRef();
          
          useFrame((state) => {
            if (groupRef.current && animation) {
              // 更新位置和姿态
              groupRef.current.position.set(
                platform.position.x,
                platform.position.y,
                platform.position.z
              );
              groupRef.current.rotation.set(
                platform.orientation.pitch,
                platform.orientation.yaw,
                platform.orientation.roll
              );
            }
          });
          
          return (
            <group ref={groupRef}>
              {/* 机身 */}
              <mesh>
                <cylinderGeometry args={[1, 1, 10, 8]} />
                <meshStandardMaterial color="gray" metalness={0.8} roughness={0.2} />
              </mesh>
              {/* 机翼 */}
              <mesh>
                <boxGeometry args={[8, 0.1, 3]} />
                <meshStandardMaterial color="gray" metalness={0.8} roughness={0.2} />
              </mesh>
            </group>
          );
        }

  # 性能优化建议
  performance_optimization:
    - tip: "使用 useMemo 缓存几何体和材质"
      example: |
        const geometry = useMemo(() => {
          return new THREE.BufferGeometry();
          // 设置顶点数据...
          return geometry;
        }, []);
    
    - tip: "使用 instancedMesh 渲染大量相似对象"
      example: |
        const instancedMeshRef = useRef();
        
        // 批量渲染 1000 个平台标记
        <instancedMesh ref={instancedMeshRef} args={[undefined, undefined, 1000]}>
          <sphereGeometry args={[5, 16, 16]} />
          <meshBasicMaterial color="red" />
        </instancedMesh>
    
    - tip: "按需加载模型，使用 Suspense 处理加载状态"
      example: |
        <Suspense fallback={<LoadingScreen />}>
          <Model url="/models/platform.gltf" />
        </Suspense>
    
    - tip: "使用 requestAnimationFrame 而非 setInterval"
      example: |
        import { useFrame } from '@react-three/fiber';
        
        function AnimatedPlatform({ platform }) {
          useFrame((state) => {
            // 每帧更新
            platform.update(state.clock.elapsedTime);
          });
          return <PlatformMesh platform={platform} />;
        }

  # 推荐 npm 包
  recommended_npm_packages:
    - package: "@react-three/fiber"
      version: "^8.0"
      purpose: "React 的 Three.js 渲染器"
      install: "npm install @react-three/fiber three"
    
    - package: "@react-three/drei"
      version: "^9.0"
      purpose: "React Three Fiber 辅助组件"
      install: "npm install @react-three/drei"
      features: ["OrbitControls", "Stars", "Environment", "useGLTF"]
    
    - package: "three"
      version: "^0.160"
      purpose: "3D 渲染引擎核心"
    
    - package: "@types/three"
      version: "^0.160"
      purpose: "TypeScript 类型定义"
      install: "npm install -D @types/three"

# ── Afsim 脚本语言兼容方案 ──
afsim_script_compatibility:
  description: "Afsim 自定义脚本语言到现代方案的迁移策略"
  
  # Afsim 脚本特性
  afsim_script_features:
    - feature: "对象创建和属性设置"
      example: |
        // Afsim 脚本:
        platform Platform1;
        Platform1.set_name("Fighter-1");
        Platform1.set_position(1000, 2000, 3000);
    
    - feature: "事件触发和条件判断"
      example: |
        // Afsim 脚本:
        Platform1.on_position_changed {
          if (self.position.x > 5000) {
            send_event("out_of_bounds");
          }
        }
    
    - feature: "循环和迭代"
      example: |
        // Afsim 脚本:
        for (i = 0; i < 100; i++) {
          create_platform("Platform" + i);
        }
    
    - feature: "函数调用和参数传递"
      example: |
        // Afsim 脚本:
        function create_fighter(name, position) {
          platform p;
          p.set_name(name);
          p.set_position(position);
          return p;
        }

  # 迁移方案
  migration_approaches:
    # 方案 1: 完全重写为 TypeScript
    - name: "完全重写为 TypeScript"
      description: "将所有 Afsim 脚本逻辑重写为 TypeScript，作为应用核心逻辑"
      pros:
        - "类型安全"
        - "与现有代码无缝集成"
        - "IDE 支持（语法高亮、自动完成）"
        - "易于调试和测试"
      cons:
        - "需要完全理解脚本语义"
        - "工作量大"
        - "可能引入新 bug"
      implementation: |
        // Afsim 脚本 → TypeScript 示例
        
        // 原始脚本:
        // platform Platform1;
        // Platform1.set_name("Fighter-1");
        // Platform1.set_position(1000, 2000, 3000);
        // Platform1.on_position_changed { ... }
        
        // 迁移后:
        import { createPlatform, Platform } from '@/entities/platform';
        
        const platform1 = createPlatform({
          name: 'Fighter-1',
          position: { x: 1000, y: 2000, z: 3000 },
        });
        
        platform1.on('position_changed', (newPos) => {
          if (newPos.x > 5000) {
            emit('out_of_bounds', { platformId: platform1.id });
          }
        });
    
    # 方案 2: 创建兼容层
    - name: "创建兼容层"
      description: "实现 Afsim 脚本解析器，在运行时解析和执行脚本"
      pros:
        - "无需修改现有脚本"
        - "渐进式迁移"
        - "向后兼容"
      cons:
        - "性能开销"
        - "需维护解析器"
        - "调试困难"
      implementation: |
        // Afsim 脚本解析器架构
        
        // src/lib/afsim-script/parser.ts
        interface ScriptParser {
          parse(input: string): AST;
          execute(ast: AST, context: ScriptContext): Promise<any>;
        }
        
        // 简单示例:
        class AfsimScriptParser {
          async execute(script: string, context: ScriptContext) {
            const statements = this.parseStatements(script);
            
            for (const stmt of statements) {
              switch (stmt.type) {
                case 'create_platform':
                  await this.executeCreatePlatform(stmt, context);
                  break;
                case 'set_property':
                  await this.executeSetProperty(stmt, context);
                  break;
                case 'on_event':
                  this.registerEventHandler(stmt, context);
                  break;
                // ...
              }
            }
          }
        }
    
    # 方案 3: 嵌入式脚本引擎
    - name: "嵌入式脚本引擎 (QuickJS/Duktape)"
      description: "集成 JavaScript 引擎，让用户脚本直接用 JS 编写"
      pros:
        - "无需学习新语言"
        - "功能强大（完整的 JS 能力）"
        - "可热更新"
      cons:
        - "沙箱安全风险"
        - "性能开销"
        - "需管理生命周期"
      implementation: |
        // 使用 QuickJS 或 Duktape
        
        // src/lib/script-engine/engine.ts
        import { ScriptEngine } from '@aspect-build/rules_js';
        
        class SandboxedScriptEngine {
          private context: ScriptContext;
          
          async executeScript(code: string) {
            const sandbox = this.createSandbox();
            
            // 暴露安全的 API 给脚本
            sandbox.expose({
              createPlatform: (config) => this.createPlatform(config),
              getPlatform: (id) => this.getPlatform(id),
              setProperty: (target, prop, value) => this.setProperty(target, prop, value),
              log: (msg) => console.log(msg),
            });
            
            // 执行脚本
            return sandbox.execute(code);
          }
          
          private createSandbox() {
            // 实现沙箱环境
            return {
              expose: (api) => { /* ... */ },
              execute: (code) => { /* ... */ },
            };
          }
        }
    
    # 方案 4: Visual DSL (拖拽式)
    - name: "可视化 DSL (拖拽式编辑)"
      description: "用拖拽流程编辑器替代脚本，降低使用门槛"
      pros:
        - "可视化、直观"
        - "降低学习成本"
        - "易于调试"
      cons:
        - "功能受限"
        - "复杂逻辑难以表达"
        - "开发成本高"
      implementation: |
        // 基于 React Flow 的可视化编辑器
        
        import ReactFlow, { 
          Background, 
          Controls, 
          MiniMap,
          useNodesState,
          useEdgesState,
          addEdge,
        } from 'reactflow';
        
        function ScriptEditor() {
          const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
          const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);
          
          const onConnect = useCallback(
            (params) => setEdges((eds) => addEdge({ ...params, type: 'smoothstep' }, eds)),
            [setEdges],
          );
          
          return (
            <div className="h-screen">
              <ReactFlow
                nodes={nodes}
                edges={edges}
                onNodesChange={onNodesChange}
                onEdgesChange={onEdgesChange}
                onConnect={onConnect}
              >
                <Background />
                <Controls />
                <MiniMap />
              </ReactFlow>
            </div>
          );
        }

  # 推荐迁移路线
  recommended_path:
    description: "从现有 Afsim 脚本迁移到现代方案的分阶段路径"
    phases:
      - phase: 1
        name: "分析和分类现有脚本"
        tasks:
          - "统计现有脚本文件数量和行数"
          - "识别脚本类型（创建、事件、逻辑、工具）"
          - "标记需要特殊处理的复杂脚本"
        estimated_effort: "1-2 周"
      
      - phase: 2
        name: "建立 TypeScript 核心 API"
        tasks:
          - "创建 Platform、Track、Event 等核心类"
          - "实现脚本需要的所有 API"
          - "编写 API 文档和示例"
        estimated_effort: "2-3 周"
      
      - phase: 3
        name: "选择迁移方案并试点"
        tasks:
          - "选择迁移方案（推荐：完全重写或兼容层）"
          - "选择 1-2 个典型脚本进行试点迁移"
          - "验证迁移结果的正确性和性能"
        estimated_effort: "2-3 周"
      
      - phase: 4
        name: "批量迁移和集成"
        tasks:
          - "按模块批量迁移剩余脚本"
          - "集成到主应用"
          - "回归测试"
        estimated_effort: "4-8 周"
      
      - phase: 5
        name: "验证和优化"
        tasks:
          - "性能测试和优化"
          - "功能完整性验证"
          - "用户反馈收集"
        estimated_effort: "1-2 周"

  # 脚本迁移检查清单
  migration_checklist:
    - [ ] 现有脚本已全部分类和统计
    - [ ] 核心 API 已完整实现
    - [ ] 事件系统已迁移（on_event → event emitter）
    - [ ] 循环和迭代已迁移
    - [ ] 条件判断已迁移
    - [ ] 函数调用已迁移
    - [ ] 外部依赖已处理（文件、网络、数据库）
    - [ ] 性能测试已通过
    - [ ] 回归测试已通过
    - [ ] 用户文档已更新
