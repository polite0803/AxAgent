  # Java 事件模型到 React 映射
  event_mapping:
    - source: "addActionListener"
      target: "onClick / onChange"
      example: |
        // Java:
        // button.addActionListener(e -> handleClick());
        // TypeScript:
        <Button onClick={handleClick}>按钮</Button>
    
    - source: "addChangeListener"
      target: "onChange"
      example: |
        // Java:
        // slider.addChangeListener(e -> handleChange());
        // TypeScript:
        <Slider onChange={handleChange} />
    
    - source: "addKeyListener"
      target: "onKeyDown / onKeyPress"
      example: |
        // Java:
        // textField.addKeyListener(new KeyAdapter() {
        //     public void keyPressed(KeyEvent e) { ... }
        // });
        // TypeScript:
        <Input onKeyDown={(e) => handleKey(e)} />
    
    - source: "addMouseListener"
      target: "onClick / onMouseEnter / onMouseLeave"
      example: |
        // Java:
        // button.addMouseListener(new MouseAdapter() {
        //     public void mouseClicked(MouseEvent e) { ... }
        // });
        // TypeScript:
        <Button onClick={handleClick} onMouseEnter={handleEnter} />
    
    - source: "addWindowListener"
      target: "useEffect + 事件监听"
      example: |
        // Java:
        // frame.addWindowListener(new WindowAdapter() {
        //     public void windowClosed(WindowEvent e) { ... }
        // });
        // TypeScript:
        useEffect(() => {
          window.addEventListener('beforeunload', handleUnload);
          return () => window.removeEventListener('beforeunload', handleUnload);
        }, []);

