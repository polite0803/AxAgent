  # ══════════════════════════════════════════════════════════
  # 扩展：Go → Rust 实现迁移步骤
  # ══════════════════════════════════════════════════════════
  - id: a-go-to-rust-implementation
    title: "Go 到 Rust 实现迁移"
    prompt: |
      你作为 Go 到 Rust 迁移实现专家，执行实际的代码迁移：

      ## 迁移映射配置
      {{mapping_profile.go_to_rust_mapping}}

      ## 实现顺序
      1. 基础类型迁移
         - int → i64
         - string → String
         - bool → bool
         - []T → Vec<T>
         - map[K]V → HashMap<K, V>
      
      2. 数据结构迁移
         - struct → struct (值语义)
         - interface → trait
         - interface{} → enum / trait object
         - 嵌入 → 组合
      
      3. 并发模型迁移
         - goroutine → tokio::spawn
         - channel → mpsc / broadcast
         - sync.WaitGroup → JoinHandle.await
         - sync.Mutex → tokio::sync::Mutex
         - context → tokio::time::timeout
      
      4. 内存安全迁移
         - 指针 → 引用 / Arc<RwLock<T>>
         - nil 检查 → Option<T>
         - defer → Drop trait (RAII)
      
      5. 错误处理迁移
         - if err != nil → Result<T, E> + ?
         - panic/recover → match / 错误处理
         - 多返回值 → Result<T, E>

      输出 JSON：{migration_result{files_migrated[{source_file, target_file, complexity}], concurrency_patterns[{pattern, rust_implementation, complexity}], memory_safety{pointers_migrated[], nil_checks_converted[], defer_to_drop[]}, error_handling{errors_converted[], panics_handled[]}, ownership_issues[{file, issue, severity, fix}], tests_added[{test_file, coverage}], issues[{type, description, severity, workaround}]}}
    tools: [search_code, file_read, file_write, run_command]
    inputs:
      analysis: a-go-to-rust-analysis.result
      go_rust_config: "config/languages/mappings/go-to-rust.yaml"
    agent:
      id: cpp_rust_migrator
      role: Go 到 Rust 实现迁移专家
    condition: "source_language == 'go' AND target_language == 'rust'"
    user_input:
      enabled: true
      mode: approval_gate
      prompt: "Go → Rust 迁移方案已完成。请确认迁移策略"
      fields:
        - name: go_rust_approval
          type: confirm
          label: "是否批准此迁移方案？"
          options: ["批准执行", "调整方案", "延后处理"]
          required: true
        - name: ownership_strategy
          type: choice
          label: "所有权处理策略"
          options:
            - "优先使用引用（&T），仅在必要时使用所有权"
            - "使用 Arc<RwLock<T>> 处理共享状态"
            - "使用 Message Passing 模型（channel）"
          required: true
        - name: unsafe_assessment
          type: choice
          label: "unsafe 代码处理方式"
          options:
            - "严格审计，尽量消除 unsafe"
            - "保留必要的 unsafe，添加详细文档"
            - "使用 safe wrapper 封装 unsafe"
          required: true

