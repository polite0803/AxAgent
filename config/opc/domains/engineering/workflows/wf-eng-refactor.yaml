  - id: a-java-to-typescript-implementation
    title: "Java 到 TypeScript 实现迁移"
    prompt: |
      你作为 Java 到 TypeScript 迁移实现专家，执行实际的代码迁移：

      ## 迁移映射配置
      {{mapping_profile.java_to_typescript_mapping}}

      ## 实现顺序
      1. Web 框架迁移
         - Spring Boot → Express/NestJS
         - @RestController → Controller 类
         - @Service → Provider/Service
         - @Repository → 数据访问层
      
      2. 数据结构迁移
         - POJO → interface / class
         - 枚举 → enum
         - 集合类 → Array / Map
         - 泛型 → 泛型 (generics)
      
      3. UI 框架迁移（如果有）
         - Swing/FX 组件 → React 组件
         - 布局管理器 → Flexbox/CSS Grid
         - 事件处理 → React 事件处理
      
      4. 数据库迁移
         - JPA/Hibernate → Prisma/TypeORM
         - JDBC → 数据库驱动
         - 连接池 → 连接池库
      
      5. 测试框架迁移
         - JUnit → Vitest/Jest
         - Mockito → Jest Mock
         - Spring Test → Supertest

      输出 JSON：{migration_result{files_migrated[{source_file, target_file, complexity}], spring_components[{type, count, target_equivalent}], ui_components[{original, target_component, complexity}], db_entities[{original, orm_model}], tests_migrated[{original_framework, target_framework}], tests_added[{test_file, coverage}], issues[{type, description, severity, workaround}]}}
    tools: [search_code, file_read, file_write]
    inputs:
      analysis: a-java-to-typescript-analysis.result
      java_ts_config: "config/languages/mappings/java-to-typescript.yaml"
    agent:
      id: ts_framework_specialist
      role: Java 到 TypeScript 实现迁移专家
    condition: "source_language == 'java' AND target_language == 'typescript'"
    user_input:
      enabled: true
      mode: approval_gate
      prompt: "Java → TypeScript 迁移方案已完成。请确认迁移策略"
      fields:
        - name: java_ts_approval
          type: confirm
          label: "是否批准此迁移方案？"
          options: ["批准执行", "调整方案", "延后处理"]
          required: true
        - name: backend_framework
          type: choice
          label: "后端框架选择"
          options:
            - "NestJS (推荐，类似 Spring 结构)"
