  # 扩展：Go → TypeScript 实现迁移步骤
  # ══════════════════════════════════════════════════════════
  - id: a-go-to-typescript-implementation
    title: "Go 到 TypeScript 实现迁移"
    prompt: |
      你作为 Go 到 TypeScript 迁移实现专家，执行实际的代码迁移：

      ## 迁移映射配置
      {{mapping_profile.go_to_typescript_mapping}}

      ## 实现顺序
      1. 基础类型迁移
         - int → number (大整数用 bigint)
         - string → string
         - bool → boolean
         - []T → T[]
         - map[K]V → Map<K, V>
      
      2. 数据结构迁移
         - struct → interface / class
         - interface{} → any / 具体类型
         - interface (Go) → interface (TypeScript)
         - 嵌入 → extends / 组合
      
      3. 并发模型迁移
         - goroutine → async function
         - channel → Promise / EventEmitter
         - sync.WaitGroup → Promise.all
         - sync.Mutex → 串行执行队列
      
      4. 错误处理迁移
         - if err != nil → try-catch / Result 模式
         - 多返回值 → 元组 / 对象
         - panic/recover → throw / try-catch
      
      5. 依赖注入迁移
         - 手动注入 → 构造函数注入
         - 全局变量 → 依赖注入容器

      输出 JSON：{migration_result{files_migrated[{source_file, target_file, complexity}], concurrency_patterns[{pattern, typescript_implementation}], error_handling{migrated_patterns[], remaining_issues[]}, tests_added[{test_file, coverage}], issues[{type, description, severity, workaround}]}}
    tools: [search_code, file_read, file_write]
