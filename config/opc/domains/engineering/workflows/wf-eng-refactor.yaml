          label: "前端框架选择"
          options:
            - "React (推荐)"
            - "Vue"
            - "无前端（纯 API）"
          required: true

  # ══════════════════════════════════════════════════════════
  # 扩展：C++ → Rust 迁移分析
  # ══════════════════════════════════════════════════════════
  - id: a-cpp-to-rust-analysis
    title: "C++ 到 Rust 迁移分析"
    prompt: |
      你作为 C++ 到 Rust 迁移专家，分析源代码并规划迁移方案：

      ## C++ → Rust 映射配置
      {{mapping_profile.cpp_to_rust_mapping}}

      请完成：
      1. 识别 C++ 特有模式（RAII、智能指针、模板、虚函数等）
      2. 规划 C++ 类型到 Rust 类型转换（int→i32、std::string→String、std::vector→Vec 等）
      3. 规划内存模型转换（new/delete→所有权系统、shared_ptr→Arc/Rc、unique_ptr→Box）
      4. 规划类/继承到 struct+trait 转换
      5. 规划模板到泛型转换
      6. 规划并发原语（std::thread→tokio::task、std::mutex→tokio::sync::Mutex）
      7. 评估迁移复杂度和 unsafe 代码比例

      输出 JSON：{cpp_rust_analysis{patterns_identified[{pattern, count, complexity}], memory_patterns[{pattern, count, risk_level}], class_hierarchy{classes_count, inheritance_depth, virtual_functions}}, template_usage{template_functions, template_classes, complexity}, concurrency_patterns[{pattern, count, migration_complexity}], unsafe_code{lines_total, distribution_by_module[]}, estimated_effort, risk_assessment{high_risk_modules[], unsafe_percentage}}}
    tools: [search_code, file_read]
    inputs:
      asset_scan: a-asset-scan.result
      cpp_rust_config: "config/languages/mappings/cpp-to-rust.yaml"
      type_mapping: a-type-mapping.result
      memory_audit: a-memory-audit.result
    agent:
      id: cpp_rust_migrator
      role: C++ 到 Rust 迁移专家
    condition: "source_language == 'cpp' AND target_language == 'rust'"

  # ══════════════════════════════════════════════════════════
  # 扩展：C++ → Rust 实现迁移步骤
  # ══════════════════════════════════════════════════════════
  - id: a-cpp-to-rust-implementation
    title: "C++ 到 Rust 实现迁移"
    prompt: |
      你作为 C++ 到 Rust 迁移实现专家，执行实际的代码迁移：

      ## 迁移映射配置
      {{mapping_profile.cpp_to_rust_mapping}}

      ## 实现顺序
      1. 基础类型迁移
         - int/long → i32/i64
         - unsigned → u32/u64
         - float/double → f32/f64
         - std::string → String
         - std::vector<T> → Vec<T>
         - std::map<K,V> → HashMap/BTreeMap

      2. 智能指针与所有权迁移
         - unique_ptr → Box<T>
         - shared_ptr → Arc<T>/Rc<T>
         - weak_ptr → Weak<T>
         - 裸指针 → 引用(&T)或Box<T>

      3. 类与继承迁移
         - class → struct + impl
         - 虚函数 → trait 方法
         - 继承 → 组合 + trait
         - 多重继承 → 多 trait 实现

      4. 模板到泛型迁移
         - template<typename T> → 泛型 <T: Trait>
         - 模板特化 → 枚举匹配

      5. 并发模型迁移
         - std::thread → tokio::spawn
         - std::mutex → tokio::sync::Mutex
         - std::atomic → std::sync::atomic
         - condition_variable → tokio::sync::Notify

      6. 内存安全迁移
         - RAII → Drop trait
         - new/delete → 所有权系统
         - 内存泄漏 → 编译期安全保证

      7. 错误处理迁移
         - try-catch → match + Result<T, E>
         - 自定义异常 → thiserror 枚举
         - 错误码 → Result 类型

      8. STL 到 Rust 标准库迁移
         - std::sort → slice::sort
         - std::find → Iterator::find
         - std::transform → Iterator::map
         - std::accumulate → Iterator::sum

      输出 JSON：{migration_result{files_migrated[{source_file, target_file, complexity}], types_migrated[{cpp_type, rust_type, count}], pointer_conversion{unique_ptr_to_box[], shared_ptr_to_arc[], raw_pointer_resolved[]}, class_conversion{classes_to_struct[], virtual_to_trait[], inheritance_to_composition[]}, template_to_generic{functions[], classes[]}, concurrency_migration{threads_to_tokio[], mutex_to_async_mutex[]}, stl_to_std{algorithms_migrated[], containers_migrated[]}, unsafe_code_generated{files, blocks_count, rationale}, tests_added[{test_file, coverage}], issues[{type, description, severity, workaround}]}}
    tools: [search_code, file_read, file_write, run_command]
    inputs:
      analysis: a-cpp-to-rust-analysis.result
      cpp_rust_config: "config/languages/mappings/cpp-to-rust.yaml"
      type_mapping: a-type-mapping.result
      memory_audit: a-memory-audit.result
      behavioral_snapshot: a-behavior-snapshot.result
    agent:
      id: cpp_rust_migrator
      role: C++ 到 Rust 实现迁移专家
    condition: "source_language == 'cpp' AND target_language == 'rust'"
    user_input:
      enabled: true
      mode: approval_gate
      prompt: "C++ → Rust 迁移方案已完成。请确认迁移策略"
      fields:
        - name: cpp_rust_approval
          type: confirm
          label: "是否批准此迁移方案？"
          options: ["批准执行", "调整方案", "延后处理"]
          required: true
        - name: migration_strategy
          type: choice
          label: "迁移执行策略"
          options:
            - "按模块逐步迁移（推荐）"
            - "按功能分层迁移"
            - "核心库先行，业务后移"
          required: true
        - name: ownership_policy
          type: choice
          label: "所有权处理策略"
          options:
            - "严格所有权，尽量使用引用（推荐）"
            - "适当使用 Arc<RwLock> 简化并发"
            - "消息传递模型（channel）"
          required: true
        - name: unsafe_tolerance
          type: choice
          label: "unsafe 代码容忍度"
          options:
            - "零 unsafe，完全安全（推荐）"
            - "允许必要的 unsafe（封装在小范围）"
            - "保留部分 unsafe，后续优化"
          required: true
        - name: priority_modules
          type: text
          label: "优先迁移的模块"
          placeholder: "例如: 核心算法, 数据结构, 工具库"
          required: false

