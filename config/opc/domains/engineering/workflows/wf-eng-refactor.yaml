          label: "CSS 框架选择"
          options: ["Tailwind CSS 4 (推荐)", "Ant Design 主题", "原生 CSS", "其他"]
          required: false

  - id: a-i18n-analysis
    title: "国际化迁移分析"
    prompt: |
      你作为国际化迁移专家，分析源框架的国际化实现并规划迁移方案：

      ## 源框架 i18n 配置（从配置加载）
      {{mapping_profile.i18n_mapping}}

      ## i18n 检查清单
      {{mapping_profile.i18n_checklist}}

      ## 无 i18n 源实现时的从零搭建策略
      {{mapping_profile.i18n_from_scratch}}

      ## 后端消息国际化配置
      {{mapping_profile.backend_message_i18n}}

      请完成：
      1. 扫描源代码中所有国际化相关代码（QTranslator、tr()、translate() 等）
      2. **判断源 i18n 状态**：
         - 有现有 i18n：分析 .ts/.qm 文件结构和内容
         - 无现有 i18n：统计硬编码字符串数量和分布
      3. 识别所有硬编码字符串（需全部替换为 t() 调用）
      4. 规划 i18next 配置方案（语言支持、命名空间结构）
      5. 设计翻译 key 的命名规范（module.submodule.key）
      6. 如果有现有 i18n：规划 .ts → JSON 文件的转换流程
      7. 如果无现有 i18n：规划"提取硬编码 → 建立翻译文件 → 替换为 t() 调用"的流程
      8. 检查插值变量、复数形式、日期/数字格式化的特殊处理
      9. **后端消息分析（新增）**：
         - 识别所有后端推送给用户的消息（QMessageBox、statusBar、emit 信号等）
         - 分析消息类型（错误、警告、信息、成功）
         - 规划错误码体系（namespace.module.action.result）
         - 选择前后端消息传递模式（前端翻译/后端翻译/混合模式）
         - 设计前后端 i18n 同步策略

      输出 JSON：{i18n_analysis{current_state{has_i18n[boolean], translator_usage[count, files], hardcoded_strings[count, files, samples[], languages[]], translation_files[{path, format, entry_count}], backend_messages[{source, type, count, samples[]}], locale_coverage[supported_languages[]]}, migration_plan{mode[import_existing | build_from_scratch], target_languages[], key_naming_convention, namespace_structure, file_organization, backend_i18n_pattern[frontend_translation | backend_translation | hybrid]}, conversion_strategy{mode_specific_config[ts_to_json_method | extraction_strategy], key_mapping_table[{source_pattern, i18next_key}], special_cases[{type, source, target, complexity}]}, backend_strategy{error_code_convention, frontend_backend_sync, error_code_mapping_table[{qt_source, rust_error_code, ts_translation_key}]}, complexity_assessment{total_entries, auto_mappable, manual_review_required, estimated_effort, risk_level}}, migration_workflow{step1_scan, step2_extract_or_convert, step3_key_mapping, step4_code_update, step5_verify, step6_backend_integration}}
    tools: [search_code, file_read]
    inputs:
      asset_scan: a-asset-scan.result
      ui_mapping: a-ui-mapping.result  # 可选，UI 迁移时
      i18n_mapping_config: "config/languages/mappings/{{source_lang}}-to-{{target_lang}}.yaml#i18n_mapping"
      i18n_checklist: "config/languages/mappings/{{source_lang}}-to-{{target_lang}}.yaml#i18n_checklist"
      backend_i18n_config: "config/languages/mappings/{{source_lang}}-to-{{target_lang}}.yaml#backend_message_i18n"
    agent:
      id: ts_framework_specialist
      role: 国际化迁移专家
    condition: "cross_language_migration.enabled == true AND target_language == 'typescript'"
    user_input:
      enabled: true
      mode: approval_gate
      prompt: "国际化迁移分析完成。请确认方案"
      fields:
        - name: enable_i18n
          type: choice
          label: "i18n 迁移模式"
          options: ["启用 i18n（推荐）", "暂不启用，后续添加", "仅提取字符串，不替换代码"]
          description: "如果原代码库无国际化实现，选择是否在目标代码中添加 i18n 支持"
          required: true
        - name: backend_i18n_pattern
          type: choice
          label: "后端消息国际化模式"
          options: ["前端翻译模式（推荐）", "后端翻译模式", "混合模式（错误码+参数）", "暂不处理后端消息"]
          description: "选择后端返回消息的国际化处理方式。前端翻译模式：后端返回错误码，前端查找翻译；后端翻译模式：后端直接返回已翻译文本；混合模式：后端返回错误码+参数，前端翻译"
          required: true
        - name: i18n_approval
          type: confirm
          label: "是否批准此国际化迁移方案？"
          options: ["批准执行", "需要调整", "需要重新分析"]
          required: true
        - name: target_languages
          type: text
          label: "目标支持语言"
          placeholder: "例如: zh-CN, en, ja, ko"
          required: false
        - name: key_naming
          type: choice
          label: "Key 命名规范"
          options: ["点分命名 (module.sub.key)", "下划线 (module_sub_key)", "短横线 (module-sub-key)", "保持原样"]
          required: false

  # ══════════════════════════════════════════════════════════
  # Afsim 仿真框架迁移专用步骤
  # 条件：source_framework 包含 "Qt" 且检测到 Afsim 特征
  # ══════════════════════════════════════════════════════════
  - id: a-afsim-analysis
    title: "Afsim 仿真框架特征分析"
    prompt: |
      你作为 Afsim 仿真框架迁移专家，分析源代码的 Afsim 特征：

      ## Afsim 特定映射配置
      {{mapping_profile.afsim_math_mapping}}
      
      ## Afsim 架构映射配置
      {{mapping_profile.afsim_architecture_mapping}}
      
      ## Afsim Qt Widget 增强映射
      {{mapping_profile.afsim_qt_widget_enhanced_mapping}}

      请完成：
      1. 识别 Afsim 核心类（WsfObject、WsfPlatform、WsfTrack、WsfPlugin 等）
      2. 识别 Afsim 数学类型（UtVec3、UtMatrix、UtQuaternion、UtEarth 等）
      3. 识别 Afsim 特定 Qt Widget（QDockWidget、QGLWidget、QTreeWidget 等）
      4. 识别 Afsim 脚本系统和自定义 DSL
      5. 识别 Afsim 特定的协议（DIS/HLA 等分布式仿真接口）
      6. 评估迁移复杂度并给出优先级排序
      
      输出 JSON：{afsim_analysis{core_classes[{name, usage_count, complexity, priority}], math_types[{name, usage_count, target_crate, target_typescript}], custom_widgets[{name, count, complexity, target_impl}], script_system{detected[boolean], language, complexity}, protocols[{name, type, complexity}], complexity_assessment{overall_score[1-10], estimated_effort_weeks, high_risk_areas[]}, migration_priority{phase1_core[], phase2_engine[], phase3_ui[], phase4_advanced[]}}}
