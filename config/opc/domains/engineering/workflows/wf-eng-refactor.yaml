  # ══════════════════════════════════════════════════════════
  # 扩展：TypeScript → Rust 实际迁移步骤
  # ══════════════════════════════════════════════════════════
  - id: a-typescript-to-rust-implementation
    title: "TypeScript 到 Rust 实现迁移"
    prompt: |
      你作为 TypeScript 到 Rust 迁移实现专家，执行实际的代码迁移：

      ## 迁移映射配置
      {{mapping_profile.typescript_to_rust_mapping}}

      ## 实现顺序
      1. 基础类型迁移
         - number → f64 / i64 / u64（根据用途选择）
         - string → String
         - boolean → bool
         - undefined/null → Option<T>
         - T[] → Vec<T>
      
      2. 数据结构迁移
         - interface → trait + struct
         - type alias → type / newtype
         - enum → enum (代数数据类型)
         - class → struct + impl
      
      3. 异步迁移
         - async/await → async/await (Rust)
         - Promise → impl Future / BoxFuture
         - EventEmitter → broadcast/mpsc channel
      
      4. Web 框架迁移（如果有）
         - Express/NestJS → Axum
         - 装饰器 → 手动路由注册
         - 中间件 → tower middleware
      
      5. 数据库迁移（如果有）
         - Prisma/TypeORM → SeaORM
         - 查询构建器 → SeaORM 查询
         - 数据验证 → validator crate
      
      6. 错误处理迁移
         - try-catch → match + Result<T, E>
         - throw → Err(MyError::Variant)
         - 自定义错误类 → thiserror enum
      
      7. 序列化迁移
         - JSON → serde + serde_json
         - class-transformer → 自定义 From 实现
      
      8. 依赖注入迁移
         - DI 装饰器 → 构造函数注入 + Arc<dyn>
         - 服务定位器 → 启动时手动组装

      输出 JSON：{migration_result{files_migrated[{source_file, target_file, complexity}], patterns_used[{pattern, rust_implementation}], tests_added[{test_file, coverage}], issues[{type, description, severity, workaround}]}}
    tools: [search_code, file_read, file_write]
    inputs:
      analysis: a-typescript-to-rust-analysis.result
      ts_rust_config: "config/languages/mappings/typescript-to-rust.yaml"
    agent:
      id: backend_integration_specialist
      role: TypeScript 到 Rust 实现迁移专家
    condition: "source_language == 'typescript' AND target_language == 'rust' AND file_pattern_contains != '.tsx'"
    user_input:
      enabled: true
      mode: approval_gate
      prompt: "TypeScript → Rust 迁移方案已完成。请确认迁移策略"
      fields:
        - name: ts_rust_approval
          type: confirm
          label: "是否批准此迁移方案？"
          options: ["批准执行", "调整方案", "延后处理"]
          required: true
        - name: framework_migration
          type: choice
          label: "Web 框架迁移方式"
          options:
            - "完整迁移到 Axum"
            - "保留 API 接口，内部重构"
            - "混合模式（新功能用 Axum，旧代码保留）"
          required: true
        - name: priority_migration
          type: text
          label: "优先迁移的模块"
          placeholder: "例如: 用户认证, 数据访问层, API 网关"
          required: false
        - name: testing_strategy
          type: choice
          label: "测试策略"
          options:
