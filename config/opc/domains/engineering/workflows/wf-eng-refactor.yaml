  # ══════════════════════════════════════════════════════════
  # 自动化测试生成器（增强版 - 支持所有迁移路径）
  # ══════════════════════════════════════════════════════════
  - id: a-test-generator
    title: "自动化测试生成"
    prompt: |
      你作为自动化测试生成专家，为迁移后的代码生成完整的测试套件：

      ## 目标语言测试框架配置
      {{target_lang_test_config}}

      ## 源语言黄金测试基线
      {{behavioral_snapshot.result}}

      ## 迁移结果摘要
      {{migration_result_summary}}

      ## 测试生成策略
      1. 单元测试生成
         - 为每个迁移的函数/方法生成单元测试
         - 覆盖正例、反例、边界条件
         - 基于源语言黄金测试用例生成等价测试
         - 目标覆盖率：≥ 80%
      
      2. 集成测试生成
         - API 接口测试
           · Rust 目标：axum::test / reqwest
           · TypeScript 目标：supertest / vitest
         - 数据库集成测试
         - 服务间调用测试
         - IPC 通信测试（Tauri 应用）
      
      3. 契约测试生成
         - 源系统 API 契约文档化
         - 目标系统 API 兼容性验证
         - 自动生成 API 对比测试
         - OpenAPI/Swagger 规范一致性检查
      
      4. 性能测试生成
         - 基准测试
           · Rust 目标：criterion.rs
           · TypeScript 目标：vitest benchmark / bench.js
         - 负载测试脚本（k6 / autocannon）
         - 性能回归检测
         - 与源系统性能基线对比
      
      5. 等价性测试生成（跨语言迁移专用）
         - 源系统 vs 目标系统输出对比
         - 黄金测试用例执行对比
         - 随机输入下的行为一致性验证
         - 边界条件等价性测试
         - 副作用序列一致性验证

      6. UI 测试生成（前端迁移专用）
         - 组件渲染测试（@testing-library/react）
         - 用户交互测试
         - 视觉回归测试（Storybook / Percy）
         - 响应式布局测试

      7. 国际化测试生成（i18n 迁移专用）
         - 多语言切换测试
         - 翻译完整性检查
         - 插值变量测试
         - 日期/数字格式化测试

      ## 测试框架选择（根据目标语言自动配置）
      - Rust 目标：cargo test + criterion.rs + axum::test
      - TypeScript 目标：Vitest + Playwright + @testing-library/react
      - API 测试：postman/newman / axum::test / supertest
      - UI 测试：Storybook + Percy
      - 性能测试：k6 / autocannon / criterion.rs

      请完成：
      1. 分析需要测试的模块和函数
      2. 基于黄金测试基线生成等价单元测试
      3. 生成集成测试代码
