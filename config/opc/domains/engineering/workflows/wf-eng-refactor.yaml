      afsim_config: "config/languages/mappings/{{source_lang}}-to-{{target_lang}}.yaml#afsim_math_mapping"
      afsim_architecture: "config/languages/mappings/{{source_lang}}-to-{{target_lang}}.yaml#afsim_architecture_mapping"
      afsim_widgets: "config/languages/mappings/{{source_lang}}-to-{{target_lang}}.yaml#afsim_qt_widget_enhanced_mapping"
      rust_mapping: "config/languages/mappings/cpp-to-rust.yaml#afsim_rust_mapping"
    agent:
      id: ts_framework_specialist
      role: Afsim 仿真框架迁移专家
    condition: "source_framework_contains == 'Qt' AND file_pattern_contains == 'afsim'"
    user_input:
      enabled: true
      mode: approval_gate
      prompt: "Afsim 框架特征分析完成。请确认迁移优先级"
      fields:
        - name: afsim_migration_approval
          type: confirm
          label: "是否批准此 Afsim 迁移方案？"
          options: ["批准执行", "需要调整优先级", "需要重新分析"]
          required: true
        - name: afsim_phase_selection
          type: text
          label: "优先迁移阶段"
          placeholder: "例如: phase1_core, phase2_engine"
          required: false
        - name: afsim_3d_strategy
          type: choice
          label: "3D 可视化迁移策略"
          options: ["使用 Three.js 完整迁移", "简化为 2D 视图", "延后处理", "使用 D3.js 数据可视化"]
          required: false
        - name: afsim_script_strategy
          type: choice
          label: "脚本系统迁移策略"
          options: ["完全重写为 TypeScript", "创建兼容层", "移植为 Python", "延后处理"]
          required: false

  - id: a-afsim-math-conversion
    title: "Afsim 数学类型转换"
    prompt: |
      你作为数学计算库迁移专家，执行 Afsim 数学类型的转换：

      ## 数学类型映射配置
      {{mapping_profile.afsim_math_mapping}}
      
      ## Rust crate 推荐
      {{mapping_profile.recommended_crates}}

      请完成：
      1. 将 UtVec2/UtVec3 转换为 nalgebra::Vector2/Vector3
      2. 将 UtMatrix3x3/UtMatrix4x4 转换为 nalgebra::Matrix3/Matrix4
      3. 将 UtQuaternion 转换为 nalgebra::UnitQuaternion
      4. 实现 UtEarth 坐标转换（WGS84/ECEF/NED）
      5. 迁移所有向量运算（Add、Subtract、Dot、Cross、Normalize）
      6. 迁移所有矩阵运算（Multiply、Transpose、Determinant）
      7. 生成对应的 TypeScript 数学工具类
      
      输出 JSON：{math_conversion{converted_types[{source, target_rust, target_typescript, file_paths[]}], operations_converted[{source_op, rust_op, typescript_op}], test_coverage{unit_tests, edge_cases}}, issues[{type, description, severity, workaround}]}
    tools: [file_read, file_write]
    inputs:
      afsim_analysis: a-afsim-analysis.result
      math_mapping: "config/languages/mappings/{{source_lang}}-to-{{target_lang}}.yaml#afsim_math_mapping"
      rust_math_mapping: "config/languages/mappings/cpp-to-rust.yaml#afsim_rust_mapping#math_crate_mapping"
    agent:
      id: code_converter
      role: 数学库迁移专家
    condition: "a-afsim-analysis.result.math_types.count > 0"
    
  - id: a-afsim-architecture-mapping
    title: "Afsim 核心架构映射"
    prompt: |
      你作为架构映射专家，执行 Afsim 核心类到 AxAgent 架构的映射：

      ## 架构映射配置
      {{mapping_profile.afsim_architecture_mapping}}

      请完成：
      1. 将 WsfObject 基类迁移为 Rust trait + TypeScript interface
      2. 将 WsfPlatform 迁移为 Agent struct + Zustand Store
      3. 将 WsfTrack 迁移为 Conversation 模型
      4. 将 WsfPlugin 迁移为 Tool trait
      5. 将 WsfScenario 迁移为 Orchestrator
      6. 迁移事件系统（信号槽 → EventEmitter/Zustand 订阅）
      7. 迁移状态管理（内部状态 → Zustand Store）
      8. 创建 Cargo workspace 结构
      
      输出 JSON：{architecture_mapping{classes_mapped[{source, target_rust, target_typescript, file_paths[]}], traits_defined[{name, methods[], implementations[]}], stores_created[{name, state_shape, actions[]}], workspace_structure{crate_members[], dependencies[]}}, issues[{type, description, severity, workaround}]}
    tools: [file_read, file_write]
    inputs:
      afsim_analysis: a-afsim-analysis.result
      architecture_mapping: "config/languages/mappings/{{source_lang}}-to-{{target_lang}}.yaml#afsim_architecture_mapping"
      rust_workspace: "config/languages/mappings/cpp-to-rust.yaml#afsim_rust_mapping#workspace_structure"
    agent:
      id: architect_analyst
      role: 架构迁移专家
    condition: "a-afsim-analysis.result.core_classes.count > 0"
    
  - id: a-afsim-ui-enhancement
    title: "Afsim UI 组件增强迁移"
    prompt: |
      你作为 UI 组件增强迁移专家，执行 Afsim 特定 Qt Widget 的迁移：

      ## Qt Widget 增强映射
      {{mapping_profile.afsim_qt_widget_enhanced_mapping}}
      
      ## Qt Designer UI 解析配置
      {{mapping_profile.qt_designer_ui_parsing}}

      请完成：
      1. 解析所有 .ui 文件（Qt Designer XML）
      2. 将 QDockWidget 系统迁移为 Segmented + 可拖拽面板
      3. 将 QGLWidget/QOpenGLWidget 迁移为 Three.js Canvas
      4. 将 QStyledItemDelegate 迁移为 Ant Design Column render
      5. 将 QAbstractItemModel 迁移为 Zustand Store
      6. 将复杂 QTreeWidget（带拖拽）迁移为 Tree + dnd-kit
      7. 将 QSplitter 迁移为 Resizable 面板组
      
      输出 JSON：{ui_enhancement{widgets_converted[{source, target, complexity, file_paths[]}], custom_components_created[{name, framework, props[], events[]}], threejs_scene_setup{canvas_component, controls, lighting}}, issues[{type, description, severity, workaround}]}
