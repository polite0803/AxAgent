# 工作流：大型代码项目重构
# 适用于百万行级代码库的系统性重构，覆盖 30 个步骤、5 个阶段：
# 资产普查（含行为快照+隐式知识+类型映射+内存审计+UI映射+i18n分析） → 坏味道分析 → 重构策略（含变更融合+框架集成规划） → 执行重构（含等价验证+变更闸门+惯用模式转换+框架验证） → 验收交付（含行为保真门禁+性能对比）
id: wf-eng-refactor
name: 大型代码项目重构
description: 系统性重构百万行级遗留代码，支持同语言重构和跨语言迁移（C++→Rust、C#→Rust、Java→TypeScript 等）。内置 UI 组件映射和国际化迁移分析，支持从现有 i18n 导入或从零搭建 i18next。从资产普查到验收交付的完整闭环。
icon: "🔧"
tags: [opc, refactor, large-scale, code-quality, cross-language]
profile_id: cto
version: 4

# ── 跨语言迁移配置 ──
cross_language_migration:
  enabled: true
  language_profiles_path: "config/languages"
  source_languages_path: "config/languages/source_languages"
  target_languages_path: "config/languages/target_languages"
  mappings_path: "config/languages/mappings"
  frameworks_path: "config/languages/frameworks"
  supported_migrations:
    - source: cpp
      target: rust
      mapping_file: cpp-to-rust.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: true
      supports_i18n_migration: true
    - source: cpp
      target: typescript
      mapping_file: cpp-to-typescript.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: true
      supports_i18n_migration: true
      description: "Qt Widgets → React 组件迁移，包含完整的 UI 组件映射表和国际化迁移（支持从现有 i18n 导入或从零搭建）"
    - source: csharp
      target: rust
      mapping_file: csharp-to-rust.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: true
      supports_i18n_migration: true
      description: "WPF/WinForms → Rust 后端迁移，包含 UI 组件映射和异步模式转换"
    - source: csharp
      target: typescript
      mapping_file: csharp-to-typescript.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: true
      supports_i18n_migration: true
      description: "WPF/WinForms → React 组件迁移，包含完整的控件映射表"
    - source: java
      target: typescript
      mapping_file: java-to-typescript.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: true
      supports_i18n_migration: true
    - source: java
      target: rust
      mapping_file: java-to-rust.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: false
      supports_i18n_migration: true
      description: "Java (Spring Boot) → Rust (Axum) 后端迁移，包含依赖注入、ORM 映射"
    - source: python
      target: rust
      mapping_file: python-to-rust.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: false
      supports_i18n_migration: true
      description: "Python → Rust 迁移，包含 asyncio→tokio、装饰器→宏/特征、动态类型→静态类型转换"
    - source: python
      target: typescript
      mapping_file: python-to-typescript.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: false
      supports_i18n_migration: true
      description: "Python → TypeScript 迁移，包含动态类型转换、数据类映射、异步模式转换"
    - source: go
      target: typescript
      mapping_file: go-to-typescript.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: false
      supports_i18n_migration: true
      description: "Go → TypeScript 迁移，包含 goroutine→async/await、channel→Promise、struct→interface 转换"
    - source: go
      target: rust
      mapping_file: go-to-rust.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: false
      supports_i18n_migration: true
      description: "Go → Rust 迁移，包含 goroutine→tokio、channel→mpsc、interface{}→enum/trait 转换"
    - source: typescript
      target: rust
      mapping_file: typescript-to-rust.yaml
      recommended_framework: tauri-v2.yaml
      supports_ui_migration: false
      supports_i18n_migration: true
      description: "TypeScript 后端 → Rust 迁移，包含 class→struct+impl、interface→trait、Express/NestJS→Axum、Prisma/TypeORM→SeaORM 转换"
  user_selection:
    prompt: "请选择源语言、目标语言和源框架"
    fields:
      - name: source_language
        type: choice
        label: "源语言"
        options: ["C++", "C#", "Java", "Python", "Go", "TypeScript", "其他"]
        required: true
      - name: source_framework
        type: choice
        label: "源框架（可选，用于 UI 框架迁移）"
        options: ["无特定框架", "Qt (C++ UI)", "Qt Quick (C++ QML)", "MFC (C++ UI)", "WPF (C# UI)", "WinForms (C# UI)", "MAUI (C# UI)", "Swing (Java UI)", "JavaFX (Java UI)", "其他"]
        required: false
      - name: target_language
        type: choice
        label: "目标语言"
        options: ["Rust", "TypeScript", "Go", "其他"]
        required: true
      - name: target_framework
        type: choice
        label: "目标框架（可选）"
        options: ["Tauri v2 (Rust + React)", "React (纯前端)", "Axum (Rust Web)", "独立应用", "微服务", "其他"]
        required: false
      - name: i18n_strategy
        type: choice
        label: "国际化策略"
        options: ["自动检测并迁移", "启用 i18n（从零搭建）", "暂不处理 i18n", "仅提取字符串"]
        description: "如果源代码库无国际化实现，选择是否在目标代码中添加 i18n 支持"
        required: false

# ── 执行策略 ──
max_parallel_steps: 3
require_approval_milestones: true
rollback_enabled: true
auto_verify_after_each_step: true

# ── 用户输入交互配置 ──
user_interaction:
  default_mode: hybrid
  timeout:
    blocking_input: 300
    approval_gate: 600
    optional_input: 60
  on_timeout:
    blocking_input: abort
    approval_gate: auto_reject
    optional_input: proceed
  channels:
    - web_chat
    - desktop_notification
    - email_digest

