  - id: a-csharp-to-rust-analysis
    title: "C# 到 Rust 迁移分析"
    prompt: |
      你作为 C# 到 Rust 迁移专家，分析源代码并规划迁移方案：

      ## C# → Rust 映射配置
      {{mapping_profile.csharp_to_rust_mapping}}

