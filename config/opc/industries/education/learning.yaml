version: 1
industry_id: "education"
industry_name: "教育"

reflection:
  enabled: true
  min_quality_score: 60.0
  auto_reflect_on_failure: true
  dimensions:
    - name: "quality"
      weight: 0.3
      description: "执行结果质量"
    - name: "efficiency"
      weight: 0.2
      description: "执行效率"
    - name: "completeness"
      weight: 0.3
      description: "任务完成度"
    - name: "innovation"
      weight: 0.2
      description: "创新性与改进建议"

evolution:
  workflow_evolver:
    enabled: false
    max_iterations: 10
    improvement_threshold: 0.1
  code_evolver:
    enabled: false
    safety_check: true
    auto_apply: false

self_improvement:
  enabled: false
  schedule: "weekly"

reinforcement_learning:
  enabled: false
  learning_rate: 0.01
  discount_factor: 0.95
  exploration_rate: 0.1
  reward_weights:
    quality: 0.4
    efficiency: 0.3
    user_satisfaction: 0.3
  experience_batch_size: 32
  update_interval: 100
  auto_save: true

adapter:
  reflection_template:
    id: "education-default"
    name: "教育反思模板"
    quality_weights:
      task_completion: 0.3
      output_quality: 0.25
      efficiency: 0.2
      cost_efficiency: 0.25
    checkpoints:
      - id: "learning-outcomes"
        name: "学习成果"
        dimension: "outcomes"
        description: "评估学员知识掌握情况"
        weight: 0.4
      - id: "engagement"
        name: "参与度"
        dimension: "engagement"
        description: "评估学员课堂参与度"
        weight: 0.3
      - id: "practical-application"
        name: "实践应用"
        dimension: "application"
        description: "评估知识转化为实践能力"
        weight: 0.3
    prompts:
      - "请评估本次教学的学习成果"
      - "学员参与度如何？"
      - "知识能否转化为实践能力？"
  evolution_constraints: {}
  acceptance_criteria:
    - id: "ed-outcomes"
      name: "学习成果"
      description: "学员掌握核心知识点"
      dimension: "outcomes"
      threshold: 0.75
      is_critical: true
      weight: 0.4
    - id: "ed-engagement"
      name: "参与度"
      description: "学员积极参与互动"
      dimension: "engagement"
      threshold: 0.7
      is_critical: false
      weight: 0.3
    - id: "ed-application"
      name: "实践应用"
      description: "知识可应用于实际场景"
      dimension: "application"
      threshold: 0.65
      is_critical: false
      weight: 0.3
