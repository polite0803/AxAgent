version: 1
industry_id: "geospatial"
industry_name: "地理信息"

reflection:
  enabled: true
  min_quality_score: 60.0
  auto_reflect_on_failure: true
  dimensions:
    - name: "quality"
      weight: 0.3
      description: "执行结果质量"
    - name: "efficiency"
      weight: 0.2
      description: "执行效率"
    - name: "completeness"
      weight: 0.3
      description: "任务完成度"
    - name: "innovation"
      weight: 0.2
      description: "创新性与改进建议"

evolution:
  workflow_evolver:
    enabled: false
    max_iterations: 10
    improvement_threshold: 0.1
  code_evolver:
    enabled: false
    safety_check: true
    auto_apply: false

self_improvement:
  enabled: false
  schedule: "weekly"

reinforcement_learning:
  enabled: false
  learning_rate: 0.01
  discount_factor: 0.95
  exploration_rate: 0.1
  reward_weights:
    quality: 0.4
    efficiency: 0.3
    user_satisfaction: 0.3
  experience_batch_size: 32
  update_interval: 100
  auto_save: true

adapter:
  reflection_template:
    id: "geospatial-default"
    name: "地理信息反思模板"
    quality_weights:
      task_completion: 0.25
      output_quality: 0.3
      efficiency: 0.2
      cost_efficiency: 0.25
    checkpoints:
      - id: "data_accuracy"
        name: "数据准确性"
        dimension: "accuracy"
        description: "评估地理空间数据的精度和准确性"
        weight: 0.4
      - id: "spatial_analysis"
        name: "空间分析"
        dimension: "analysis"
        description: "评估空间分析方法的合理性和结果深度"
        weight: 0.3
      - id: "visualization_quality"
        name: "可视化效果"
        dimension: "visualization"
        description: "评估地图和可视化输出的质量和可读性"
        weight: 0.3
    prompts:
      - "请评估本次地理数据的准确性和精度"
      - "空间分析方法是否合理？"
      - "可视化效果是否清晰直观？"
  evolution_constraints:
    protected_steps:
      - step_id: "data_validation"
        reason: "数据验证是地理信息质量的基础"
      - step_id: "spatial_analysis"
        reason: "空间分析是核心业务环节"
    step_dependencies:
      - from: "data_collection"
        to: "data_validation"
        type: hard
      - from: "data_validation"
        to: "spatial_analysis"
        type: hard
      - from: "spatial_analysis"
        to: "visualization"
        type: soft
    min_steps: 4
    max_steps: 20
    must_follow_order: true
    forbidden_optimizations:
      - optimization_type: "skip_validation"
        reason: "不允许跳过数据验证"
      - optimization_type: "skip_analysis"
        reason: "空间分析是核心环节"
    quality_thresholds:
      min_accuracy: 0.8
      min_success_rate: 0.7
      min_quality_score: 0.6
  acceptance_criteria:
    - id: "geo-accuracy"
      name: "数据准确性"
      description: "地理数据精度达到规定标准"
      dimension: "accuracy"
      threshold: 0.85
      is_critical: true
      weight: 0.35
    - id: "geo-analysis"
      name: "空间分析"
      description: "空间分析方法合理，结果可靠"
      dimension: "analysis"
      threshold: 0.8
      is_critical: true
      weight: 0.3
    - id: "geo-visualization"
      name: "可视化质量"
      description: "地图和可视化输出清晰准确"
      dimension: "visualization"
      threshold: 0.75
      is_critical: false
      weight: 0.2
    - id: "geo-completeness"
      name: "数据完整性"
      description: "地理数据覆盖完整，无缺失"
      dimension: "completeness"
      threshold: 0.8
      is_critical: false
      weight: 0.15