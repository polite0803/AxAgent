# 工作流：会计财务流程
id: workflow-accounting
name: 会计财务流程
description: 创建发票 → 审批(ApprovalNode) → 通知客户 → 登记KPI。CFO 视角。
icon: "🧾"
tags: [finance, accounting]
profile_id: opc-cfo-cfo-financial-analyst
steps:
  - id: a-create
    title: 创建发票
    prompt: 根据用户信息创建发票。使用 OpcCreateInvoice。输出 JSON {invoice_id, number, total}
    inputs: {}
  - id: approval
    title: 财务审批
    node_type: approval
    approval:
      message: 请审批。24小时超时自动拒绝。
      approver: manager
      timeout_secs: 86400
      timeout_action: auto_reject
    inputs: {}
  - id: a-notify
    title: 通知客户
    prompt: 发票已审批通过。使用 OpcSendNotification 通知客户。输出 JSON {notification_status}
    inputs: {}
  - id: a-report
    title: 登记报表
    prompt: 使用 OpcRecordKpi 记录发票相关的关键指标。输出 JSON {kpi_status}
    inputs: {}