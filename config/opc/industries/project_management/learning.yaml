version: 1
industry_id: "project_management"
industry_name: "项目管理"

reflection:
  enabled: true
  min_quality_score: 60.0
  auto_reflect_on_failure: true
  dimensions:
    - name: "quality"
      weight: 0.3
      description: "执行结果质量"
    - name: "efficiency"
      weight: 0.2
      description: "执行效率"
    - name: "completeness"
      weight: 0.3
      description: "任务完成度"
    - name: "innovation"
      weight: 0.2
      description: "创新性与改进建议"

evolution:
  workflow_evolver:
    enabled: false
    max_iterations: 10
    improvement_threshold: 0.1
  code_evolver:
    enabled: false
    safety_check: true
    auto_apply: false

self_improvement:
  enabled: false
  schedule: "weekly"

reinforcement_learning:
  enabled: false
  learning_rate: 0.01
  discount_factor: 0.95
  exploration_rate: 0.1
  reward_weights:
    quality: 0.4
    efficiency: 0.3
    user_satisfaction: 0.3
  experience_batch_size: 32
  update_interval: 100
  auto_save: true

adapter:
  reflection_template:
    id: "project-management-default"
    name: "项目管理反思模板"
    quality_weights:
      task_completion: 0.3
      output_quality: 0.2
      efficiency: 0.25
      cost_efficiency: 0.25
    checkpoints:
      - id: "schedule_control"
        name: "进度控制"
        dimension: "schedule"
        description: "评估项目进度是否按计划执行"
        weight: 0.4
      - id: "cost_control"
        name: "成本控制"
        dimension: "cost"
        description: "评估项目预算执行情况和成本控制效果"
        weight: 0.3
      - id: "quality_assurance"
        name: "质量保证"
        dimension: "quality"
        description: "评估项目交付物的质量是否达标"
        weight: 0.3
    prompts:
      - "请评估本次项目的进度控制情况"
      - "项目成本是否在预算范围内？"
      - "交付物质量是否满足要求？"
  evolution_constraints:
    protected_steps:
      - step_id: "milestone_review"
        reason: "里程碑评审是项目管控的核心节点"
      - step_id: "risk_assessment"
        reason: "风险评估不可省略"
    step_dependencies:
      - from: "initiation"
        to: "planning"
        type: hard
      - from: "planning"
        to: "execution"
        type: hard
      - from: "execution"
        to: "milestone_review"
        type: soft
    min_steps: 4
    max_steps: 30
    must_follow_order: true
    forbidden_optimizations:
      - optimization_type: "skip_milestone"
        reason: "不允许跳过里程碑评审"
      - optimization_type: "skip_risk"
        reason: "风险评估是必要环节"
    quality_thresholds:
      min_accuracy: 0.75
      min_success_rate: 0.7
      min_quality_score: 0.6
  acceptance_criteria:
    - id: "pm-schedule"
      name: "进度控制"
      description: "项目按时完成，偏差不超过10%"
      dimension: "schedule"
      threshold: 0.8
      is_critical: true
      weight: 0.3
    - id: "pm-cost"
      name: "成本控制"
      description: "项目成本在预算范围内"
      dimension: "cost"
      threshold: 0.8
      is_critical: true
      weight: 0.25
    - id: "pm-quality"
      name: "质量保证"
      description: "交付物质量符合标准"
      dimension: "quality"
      threshold: 0.8
      is_critical: true
      weight: 0.25
    - id: "pm-stakeholder"
      name: "干系人满意度"
      description: "干系人对项目结果满意"
      dimension: "satisfaction"
      threshold: 0.7
      is_critical: false
      weight: 0.2