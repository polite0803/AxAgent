version: 1
industry_id: "game_dev"
industry_name: "游戏开发"

reflection:
  enabled: true
  min_quality_score: 60.0
  auto_reflect_on_failure: true
  dimensions:
    - name: "quality"
      weight: 0.3
      description: "执行结果质量"
    - name: "efficiency"
      weight: 0.2
      description: "执行效率"
    - name: "completeness"
      weight: 0.3
      description: "任务完成度"
    - name: "innovation"
      weight: 0.2
      description: "创新性与改进建议"

evolution:
  workflow_evolver:
    enabled: false
    max_iterations: 10
    improvement_threshold: 0.1
  code_evolver:
    enabled: false
    safety_check: true
    auto_apply: false

self_improvement:
  enabled: false
  schedule: "weekly"

reinforcement_learning:
  enabled: false
  learning_rate: 0.01
  discount_factor: 0.95
  exploration_rate: 0.1
  reward_weights:
    quality: 0.4
    efficiency: 0.3
    user_satisfaction: 0.3
  experience_batch_size: 32
  update_interval: 100
  auto_save: true

adapter:
  reflection_template:
    id: "game-dev-default"
    name: "游戏开发反思模板"
    quality_weights:
      task_completion: 0.25
      output_quality: 0.3
      efficiency: 0.2
      cost_efficiency: 0.25
    checkpoints:
      - id: "gameplay"
        name: "游戏玩法"
        dimension: "gameplay"
        description: "评估游戏玩法的趣味性、深度和可操作性"
        weight: 0.4
      - id: "balance"
        name: "平衡性"
        dimension: "balance"
        description: "评估游戏数值和系统的平衡性"
        weight: 0.3
      - id: "performance"
        name: "性能表现"
        dimension: "performance"
        description: "评估游戏的帧率、加载速度和稳定性"
        weight: 0.3
    prompts:
      - "请评估本次游戏玩法的设计质量"
      - "游戏数值是否平衡？"
      - "游戏性能是否达标？"
  evolution_constraints:
    protected_steps:
      - step_id: "playtest"
        reason: "游戏测试是玩法验证的核心"
      - step_id: "balance_check"
        reason: "平衡性检查是游戏体验的关键"
      - step_id: "performance_test"
        reason: "性能测试是用户体验的保障"
    step_dependencies:
      - from: "concept"
        to: "design"
        type: hard
      - from: "design"
        to: "implementation"
        type: hard
      - from: "implementation"
        to: "playtest"
        type: hard
      - from: "playtest"
        to: "balance_check"
        type: hard
      - from: "balance_check"
        to: "performance_test"
        type: soft
    min_steps: 5
    max_steps: 30
    must_follow_order: true
    forbidden_optimizations:
      - optimization_type: "skip_playtest"
        reason: "不允许跳过游戏测试"
      - optimization_type: "skip_balance"
        reason: "平衡性检查不可省略"
      - optimization_type: "skip_performance"
        reason: "性能测试是必要环节"
    quality_thresholds:
      min_accuracy: 0.75
      min_success_rate: 0.7
      min_quality_score: 0.6
  acceptance_criteria:
    - id: "gd-gameplay"
      name: "游戏玩法"
      description: "玩法有趣且具有足够深度"
      dimension: "gameplay"
      threshold: 0.8
      is_critical: true
      weight: 0.3
    - id: "gd-balance"
      name: "平衡性"
      description: "游戏数值和系统保持平衡"
      dimension: "balance"
      threshold: 0.8
      is_critical: true
      weight: 0.25
    - id: "gd-performance"
      name: "性能表现"
      description: "游戏帧率稳定，无明显卡顿"
      dimension: "performance"
      threshold: 0.85
      is_critical: true
      weight: 0.25
    - id: "gd-player-satisfaction"
      name: "玩家满意度"
      description: "玩家测试反馈积极"
      dimension: "satisfaction"
      threshold: 0.7
      is_critical: false
      weight: 0.2