# 工作流：AI 科技研究报告
id: workflow-ai-research
name: AI 科技研究报告
description: AI 技术与应用研究报告：需求分析 → 技术调研 → 原型验证 → 报告输出。CTO 视角，含防幻觉。
icon: "🤖"
tags: [ai, research, tech]
profile_id: opc-cto-cto-ai-engineer
steps:
  - id: a-req
    title: 需求分析
    prompt: 分析 AI 研究需求，明确研究范围、技术路线和评估标准。输出 JSON {requirements, tech_areas, success_criteria}
    inputs: {}
  - id: a-survey
    title: 技术调研
    prompt: 调研相关 AI 技术方案和最新进展。评估各方案的成熟度、成本和可行性。输出 JSON {solutions, comparison, recommendation}
    inputs: {}
  - id: a-prototype
    title: 原型验证
    prompt: 基于调研结果搭建最小原型，验证关键假设。输出 JSON {prototype_status, findings, risks}
    inputs: {}
  - id: a-report
    title: 研究报告
    prompt: 生成 AI 研究报告：摘要、技术分析、可行性评估、实施建议。输出 Markdown 格式报告。
    inputs: {}