# 工作流：行业咨询流程
# v3: 修复审批分支逻辑、工具适配、增加审批配置
id: workflow-industry-consulting
name: 行业咨询流程
description: 调研启动 → 信息采集 → 调研验证 → 方案设计 → 方案审批 → 报告撰写 → 交付归档。CEO 视角，战略级分析。
icon: "💼"
tags: [consulting, strategy, industry]
profile_id: opc-ceo-ceo-business-strategist
steps:
  # 步骤1：调研启动
  - id: a-intake
    title: 调研启动
    prompt: |
      作为行业分析师，明确客户的咨询目标和调研范围。
      分析行业特征、界定研究边界、确定关键问题。
      输出 JSON：{client_goals, industry_scope, key_questions, research_dimensions, success_criteria}
    inputs: {}

  # 步骤2：信息采集
  - id: a-research
    title: 信息采集
    prompt: |
      基于调研范围，系统性收集行业数据和情报。
      使用 get_industry_ranking 获取行业横向排名和趋势。
      使用 search_news 搜索行业热点新闻和政策动态。
      使用 get_cls_flash 获取最新财联社快讯。
      使用 get_index_quotes 获取大盘指数走势。
      使用 get_hot_stocks 获取市场强势股和题材热点。
      输出 JSON：{industry_overview, market_size, growth_trends, key_players, competitive_landscape, policy_landscape, technology_trends}
    inputs:
      scope: a-intake.result.industry_scope
      dimensions: a-intake.result.research_dimensions
    tools: [get_industry_ranking, search_news, get_cls_flash, get_index_quotes, get_hot_stocks]

  # 步骤3：调研验证
  - id: a-validate
    title: 调研验证
    prompt: |
      验证采集信息的质量和充分性。
      检查数据完整性：各维度信息是否覆盖到位。
      检查数据时效性：最新数据的时间戳是否在合理范围内。
      检查观点一致性：不同来源的分析结论是否存在矛盾。
      识别信息缺口，标记需要补充调研的领域。
      输出 JSON：{completeness_score, timeliness_score, consistency_score, data_gaps, quality_assessment, confidence_level}
    inputs:
      research: a-research.result

  # 步骤4：方案设计
  - id: a-design
    title: 方案设计
    prompt: |
      基于调研结果，设计针对性的咨询方案。
      分析行业痛点和机会，提出战略建议。
      设计实施路径和资源需求。
      评估方案的可行性和风险。
      输出 JSON：{strategic_findings, recommended_actions, implementation_roadmap, resource_requirements, risk_assessment, expected_outcomes}
    inputs:
      research: a-research.result
      validation: a-validate.result

  # 步骤5：方案审批
  - id: a-approval
    title: 方案审批
    node_type: approval
    approval:
      message: "请客户审批咨询方案，确认方向是否符合预期。超时将自动通过以避免阻塞流程。"
      timeout_secs: 172800
      timeout_action: auto_approve
    prompt: |
      请客户审批咨询方案，确认方向是否符合预期。
      审批通过后进入报告撰写阶段。
    inputs:
      design: a-design.result

  # 步骤6：报告撰写
  - id: a-report
    title: 报告撰写
    prompt: |
      生成完整的行业咨询报告。
      报告结构：执行摘要、行业分析、发现与洞察、战略建议、实施路线图、风险评估、附录。
      确保逻辑清晰、数据充分、建议可执行。
      输出 JSON：{executive_summary, industry_analysis, key_findings, strategic_recommendations, implementation_roadmap, risk_assessment, full_report_md}
    inputs:
      research: a-research.result
      design: a-design.result
      approval: a-approval.result

  # 步骤7：交付归档
  - id: a-deliver
    title: 交付归档
    prompt: |
      整理最终交付物包。
      生成报告摘要、核心观点卡片、行动计划清单。
      输出 JSON：{final_report_md, executive_summary, key_action_items, supporting_materials, delivery_manifest}
    inputs:
      report: a-report.result
      design: a-design.result
