version: 1
industry_id: "industry-consulting"
industry_name: "行业咨询"

reflection:
  enabled: true
  min_quality_score: 60.0
  auto_reflect_on_failure: true
  dimensions:
    - name: "quality"
      weight: 0.3
      description: "执行结果质量"
    - name: "efficiency"
      weight: 0.2
      description: "执行效率"
    - name: "completeness"
      weight: 0.3
      description: "任务完成度"
    - name: "innovation"
      weight: 0.2
      description: "创新性与改进建议"

evolution:
  workflow_evolver:
    enabled: false
    max_iterations: 10
    improvement_threshold: 0.1
  code_evolver:
    enabled: false
    safety_check: true
    auto_apply: false

self_improvement:
  enabled: false
  schedule: "weekly"

reinforcement_learning:
  enabled: false
  learning_rate: 0.01
  discount_factor: 0.95
  exploration_rate: 0.1
  reward_weights:
    quality: 0.4
    efficiency: 0.3
    user_satisfaction: 0.3
  experience_batch_size: 32
  update_interval: 100
  auto_save: true

adapter:
  reflection_template:
    id: "industry-consulting-default"
    name: "行业咨询反思模板"
    quality_weights:
      task_completion: 0.25
      output_quality: 0.3
      efficiency: 0.2
      cost_efficiency: 0.25
    checkpoints:
      - id: "insight-depth"
        name: "洞察深度"
        dimension: "depth"
        description: "分析是否深入到业务本质"
        weight: 0.4
      - id: "recommendation"
        name: "建议质量"
        dimension: "quality"
        description: "建议是否具体可执行"
        weight: 0.3
      - id: "data-support"
        name: "数据支撑"
        dimension: "data"
        description: "结论是否有充分数据支撑"
        weight: 0.3
    prompts:
      - "请评估本次咨询分析的深度"
      - "建议是否具体可行？"
      - "结论是否有数据支撑？"
  evolution_constraints: {}
  acceptance_criteria:
    - id: "ic-insight-depth"
      name: "洞察深度"
      description: "分析深入业务本质"
      dimension: "depth"
      threshold: 0.8
      is_critical: true
      weight: 0.4
    - id: "ic-recommendation"
      name: "建议质量"
      description: "建议具体可执行"
      dimension: "quality"
      threshold: 0.75
      is_critical: true
      weight: 0.35
    - id: "ic-data-support"
      name: "数据支撑"
      description: "结论有充分数据支撑"
      dimension: "data"
      threshold: 0.7
      is_critical: false
      weight: 0.25
