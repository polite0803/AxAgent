# 工作流：电商运营流程
id: workflow-ecommerce
name: 电商运营流程
description: 选品分析 → 上架落地页 → 客户管理。CPO + COO 交叉协作。
icon: "🛍️"
tags: [ecommerce, product]
profile_id: opc-cpo-cpo-product-manager
steps:
  - id: a-product
    title: 选品分析
    prompt: 分析市场和客户需求，确定产品方向。输出 JSON {product_ideas, market_fit, pricing}
    inputs: {}
  - id: a-page
    title: 上架落地页
    prompt: 使用 OpcCreateLandingPage 创建产品落地页。输出 JSON {page_id, url}
    inputs: {}
  - id: a-customer
    title: 客户管理
    prompt: 使用 OpcCreateCustomer 创建客户记录，关联产品信息。输出 JSON {customer_id, product_ref}
    inputs: {}