# 工作流：软件开发完整流程
# SDLC 14 步：需求 → 可行性 → (approval) → 架构 → 数据模型 → API → 环境搭建 → 编码 → 代码审查 → (approval) → 修复 → 文档 → 单元测试 → 集成测试 → 安全审查 → (approval) → 部署 → 运维交接
id: workflow-software-dev
name: 软件开发完整流程
description: 一人公司软件开发全流程。含 3 个人工审批闸门（可行性/代码审查/部署上线）、修复循环、环境搭建和文档编写环节。步骤间有完整数据流转。
icon: "💻"
tags: [dev, software, sdlc, engineering, opc]
profile_id: opc-cto-cto-ai-engineer
continue_on_fail: false
steps:
  # ════════════════════════════════════════════
  # 阶段一：需求与规划
  # ════════════════════════════════════════════
  - id: a-req
    title: 需求分析
    prompt: |
      你作为产品经理，分析用户需求。
      输出 JSON：{requirements, scope{in_scope, out_of_scope}, constraints, user_stories, acceptance_criteria}
    tools: [search_code, file_read]
    inputs: {}

  - id: a-feasibility
    title: 可行性评审
    prompt: |
      你作为 CTO，评估技术可行性、资源和风险。
      输出 JSON：{feasible|partially_feasible|not_feasible, risks[{risk, impact, mitigation}], go_or_no_go, action_items}
    tools: [search_code, file_read]
    inputs:
      requirements: a-req.result
    continue_on_fail: false

  - id: a-feasibility-approval
    title: 可行性评审审批
    node_type: approval
    description: "批准项目进入架构设计阶段"
    approve_label: "批准进入架构设计"
    reject_label: "驳回，返回需求重定义"
    inputs:
      feasibility_report: a-feasibility.result

  # ════════════════════════════════════════════
  # 阶段二：设计
  # ════════════════════════════════════════════
  - id: a-arch
    title: 架构设计
    prompt: |
      你作为架构师，设计系统架构和技术栈。
      输出 JSON：{architecture{pattern, layers, components}, tech_stack{frontend, backend, database, infrastructure}, modules[{name, responsibility, dependencies}], deployment_diagram}
    tools: [search_code, file_read, file_write]
    inputs:
      requirements: a-req.result
      feasibility: a-feasibility.result

  - id: a-data
    title: 数据模型设计
    prompt: |
      设计数据库实体、关系和索引。
      输出 JSON：{entities[{name, fields[{name, type, constraints}]}], relationships[{from, to, type}], indexes[{entity, fields, type}], migration_plan, data_retention}
    tools: [search_code, file_read, file_write]
    inputs:
      architecture: a-arch.result

  - id: a-api
    title: API 设计
    prompt: |
      设计 RESTful API 接口和认证策略。
      输出 JSON：{endpoints[{method, path, description, request_schema, response_schema}], auth_strategy, rate_limits, error_codes, sdk_plan}
    tools: [search_code, file_read, file_write]
    inputs:
      architecture: a-arch.result
      data_model: a-data.result

  # ════════════════════════════════════════════
  # 阶段三：环境与实现
  # ════════════════════════════════════════════
  - id: a-setup
    title: 项目环境搭建
    prompt: |
      你作为 DevOps，初始化开发环境：创建项目目录结构、配置文件、依赖清单、CI 配置。
      输出 JSON：{project_structure, config_files_created, dependencies, ci_pipeline, environment_notes}
    tools: [file_read, file_write, run_command]
    inputs:
      architecture: a-arch.result
      tech_stack: a-arch.result

  - id: a-code
    title: 编码实现
    prompt: |
      你作为高级工程师，按设计实现代码。先创建数据模型和 API 框架，再实现核心业务逻辑。
      输出 JSON：{modules_implemented[{name, files, status}], code_summary, file_structure, known_issues}
    tools: [file_read, file_write, run_command, search_code]
    inputs:
      architecture: a-arch.result
      data_model: a-data.result
      api_design: a-api.result
      project_setup: a-setup.result
    continue_on_fail: false

  - id: a-cr
    title: 代码审查
    prompt: |
      你作为代码审查者，审查代码质量：逻辑正确性、安全性、性能、可维护性。
      输出 JSON：{review_findings[{file, line, severity, category, description, suggestion}], statistics{files_reviewed, issues_found, critical, high}, approved, fix_suggestions}
    tools: [file_read, search_code, lint, run_command]
    inputs:
      implementation: a-code.result

  - id: a-cr-approval
    title: 代码审查审批
    node_type: approval
    description: "代码审查是否通过？若有严重问题，将进入修复环节。"
    approve_label: "审查通过，进入文档编写"
    reject_label: "需修复，进入修复环节"
    inputs:
      review_report: a-cr.result

  - id: a-fix
    title: 缺陷修复
    prompt: |
      你作为高级工程师，根据代码审查意见修复代码缺陷。修复完成后再次自检。
      输出 JSON：{fixes_applied[{file, issue_severity, fix_description}], remaining_issues, fix_verification}
    tools: [file_read, file_write, run_command, lint, search_code]
    inputs:
      implementation: a-code.result
      review_findings: a-cr.result
    continue_on_fail: false

  # ════════════════════════════════════════════
  # 阶段四：文档与测试
  # ════════════════════════════════════════════
  - id: a-doc
    title: 文档编写
    prompt: |
      生成设计文档、API 文档和开发指南。
      输出 JSON：{design_doc{architecture_overview, module_descriptions, data_models}, api_reference{endpoints_table, authentication, error_handling}, dev_guide{setup_instructions, coding_conventions, deployment_steps}}
    tools: [file_read, file_write, search_code]
    inputs:
      implementation: a-code.result
      data_model: a-data.result
      api_design: a-api.result
      fixes: a-fix.result

  - id: a-unit-test
    title: 单元测试
    prompt: |
      你作为测试工程师，为核心模块编写单元测试，覆盖边界条件。
      输出 JSON：{test_suites[{module, tests, passed, failed}], coverage{overall, by_module}, bugs_found[{id, module, description, severity}], test_results}
    tools: [file_read, file_write, run_command, run_tests]
    inputs:
      implementation: a-code.result
      fixes: a-fix.result
    continue_on_fail: false

  - id: a-integration-test
    title: 集成测试
    prompt: |
      执行模块间集成测试和端到端测试。
      输出 JSON：{integration_report{scenarios, passed, failed}, e2e_results[{flow, steps, status, duration_ms}], integration_bugs[{id, modules, description, severity}], performance_baseline}
    tools: [file_read, run_command, run_tests]
    inputs:
      implementation: a-code.result
      unit_test_results: a-unit-test.result

  - id: a-security
    title: 安全审查
    prompt: |
      执行安全审计：依赖漏洞、密钥泄露、OWASP Top 10。
      输出 JSON：{vulnerabilities[{id, type, severity, cwe, description, recommendation}], dependency_audit{total, vulnerable, outdated}, security_score, mitigations}
    tools: [file_read, search_code, lint, run_command]
    inputs:
      implementation: a-code.result
      review_findings: a-cr.result

  # ════════════════════════════════════════════
  # 阶段五：交付
  # ════════════════════════════════════════════
  - id: a-deploy-approval
    title: 部署审批
    node_type: approval
    description: "批准部署到目标环境（staging/production）"
    approve_label: "批准部署"
    reject_label: "暂不部署"
    inputs:
      security_audit: a-security.result
      integration_test: a-integration-test.result

  - id: a-deploy
    title: 部署上线
    prompt: |
      执行部署：构建、数据库迁移、环境配置、健康检查。
      输出 JSON：{deploy_status, build_info{version, commit_hash, build_time}, environment{target, config}, database_migration{status, migrations_applied, rollback_plan}, health_check{api, db, dependencies}, monitoring_setup}
    tools: [file_read, run_command, run_tests]
    inputs:
      implementation: a-code.result
      security_audit: a-security.result
      integration_test: a-integration-test.result
    continue_on_fail: false

  - id: a-handoff
    title: 运维交接
    prompt: |
      生成运维文档和交接包。
      输出 JSON：{runbook[{operation, steps, rollback}], monitoring_dashboard{metrics, alerts}, knowledge_base[{topic, content, tags}], postmortem_plan, final_summary{total_modules, test_coverage, security_score, go_live_readiness}}
    tools: [file_read, file_write, search_code]
    inputs:
      deploy_result: a-deploy.result
      security_audit: a-security.result
      integration_test: a-integration-test.result
